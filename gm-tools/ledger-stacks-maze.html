<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#1b1712;font-family:Georgia,serif;color:#f3e6cc}
</style></head><body><svg id="s" xmlns="http://www.w3.org/2000/svg" width="1560" height="1420"></svg>
<script>
const s = document.getElementById('s');
const NS = 'http://www.w3.org/2000/svg';
const el = (t, a, txt, parent = s) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; parent.appendChild(e); return e; };
const report = [];

// ---------------------------------------------------------------- the fixed building (band rows 9-24)
const R0 = 8, R1 = 25;                 // rows drawn (8 = rooms' bottom wall, 25 = clerks' floor edge)
const building = new Set();
const add = (c, r) => building.add(c + ',' + r);
for (let c = 1; c <= 24; c++) add(c, 8);                                   // the rooms along the top
for (let r = 12; r <= 20; r++) { add(4, r); add(21, r); }                  // office walls
for (let c = 1; c <= 4; c++) { add(c, 12); add(c, 20); }
for (let c = 21; c <= 24; c++) { add(c, 12); add(c, 20); }
for (let r = 13; r <= 19; r++) for (const c of [1, 2, 3, 22, 23, 24]) add(c, r); // office interiors (not part of the maze)
const DOORS = { auditor: [4, 16], collector: [21, 16], archive: [3, 8], steps1: [12, 8], steps2: [13, 8], strong: [22, 8] };

// the hub: interior cols 9-15, rows 15-21. Its walls never move.
const HUB = ['h2 9 14', 'h4 12 14', 'v4 16 15', 'v2 16 20', 'v2 8 15', 'v4 8 18', 'h4 9 22', 'h2 14 22'];
const EXITS = { N: [11, 14], E: [16, 19], W: [8, 17] };
const SOUTH_LINE = ['h6 1 24', 'h6 7 24', 'h6 14 24', 'h4 20 24'];
const LURE_SEAL = ['h2 13 23'];

const CONFIGS = [
  { key: 'lure', title: '1 · The Lure', sub: 'One gap in the shelf line pulls the party into the hub.',
    pieces: [...SOUTH_LINE], exitsOpen: [], start: [13, 25], target: [12, 18], sealAt: [13, 22], sealSide: 'h', exits: { N: 'red', W: 'blue', E: 'gold' } },
  { key: 'hub', title: '2 · The Hub (every return)', sub: 'Sealed behind them. Three exits, each a colour shelf to examine.',
    pieces: [...SOUTH_LINE, ...LURE_SEAL], exitsOpen: [], exits: { N: 'red', W: 'blue', E: 'gold' } },
  { key: 'A', title: '3 · Run to the Auditor', sub: 'Doom hall: 9 east-west + 7 down. Door is two squares from the shelf.',
    pieces: [...SOUTH_LINE, ...LURE_SEAL, 'h6 5 10', 'h4 11 10', 'v2 4 10', 'h4 6 12', 'h4 10 12', 'v6 6 13', 'h2 5 19', 'h2 19 17', 'v4 18 21'],
    target: DOORS.auditor, hall: [[13, 11, 5, 11], [5, 12, 5, 18]], seal: [14, 11, 13, 11], doom: [5, 18], exitsOpen: ['N', 'E', 'W'] },
  { key: 'C', title: '4 · Run to the Collector', sub: 'The mirror image. Approach from the north-west corner.',
    pieces: [...SOUTH_LINE, ...LURE_SEAL, 'h4 11 10', 'h6 15 10', 'v2 21 10', 'h4 12 12', 'h4 16 12', 'v6 19 13', 'h2 19 19', 'h2 5 17', 'v4 6 21'],
    target: DOORS.collector, hall: [[12, 11, 20, 11], [20, 12, 20, 18]], seal: [11, 11, 12, 11], doom: [20, 18], exitsOpen: ['N', 'E', 'W'] },
  { key: 'D', title: '5 · Run to the Archive', sub: 'Long hall under the dais. The shelf starts past the archive door.',
    pieces: [...SOUTH_LINE, ...LURE_SEAL, 'h6 1 10', 'h6 7 10', 'h6 5 12', 'v2 17 11', 'h2 19 15', 'v4 7 19'],
    target: [3, 9], hall: [[12, 9, 1, 9]], seal: [13, 9, 12, 9], doom: [1, 9], exitsOpen: ['N', 'E', 'W'] },
  { key: 'F', title: '6 · The Final Account', sub: 'Three folios in. The north wall parts into an aisle to the steps.',
    pieces: [...SOUTH_LINE, ...LURE_SEAL, 'v4 10 10', 'v4 15 10', 'h2 9 14', 'h2 15 14'], removeHub: ['h2 9 14', 'h4 12 14'],
    target: [12, 9], exitsOpen: [], aisle: true },
];

const cells = p => { const [t, c, r] = p.split(' '); const n = +t.slice(1), out = []; for (let i = 0; i < n; i++) out.push(t[0] === 'h' ? [+c + i, +r] : [+c, +r + i]); return out; };

function blocked(cfg) {
  const B = new Set(building);
  const hub = HUB.filter(p => !(cfg.removeHub || []).includes(p));
  for (const p of [...hub, ...cfg.pieces]) for (const [c, r] of cells(p)) B.add(c + ',' + r);
  for (const k of Object.keys(EXITS)) if (!(cfg.exitsOpen || []).includes(k) && !cfg.aisle) B.add(EXITS[k].join(','));
  if (cfg.aisle) for (const k of ['E', 'W']) B.add(EXITS[k].join(','));
  if (cfg.aisle) { B.delete('12,8'); B.delete('13,8'); }
  return B;
}
function bfs(B, from, to, extraBlock) {
  const key = (c, r) => c + ',' + r, prev = new Map([[key(...from), null]]), q = [from];
  const tk = key(...to);
  const pass = (c, r) => { const k = key(c, r); if (k === tk) return true; if (extraBlock && extraBlock.has(k)) return false; if (B.has(k)) return false; return c >= 1 && c <= 24 && r >= 9 && r <= 25; };
  while (q.length) {
    const [c, r] = q.shift();
    if (key(c, r) === tk) { const path = []; let k = tk; while (k) { path.push(k.split(',').map(Number)); k = prev.get(k); } return path.reverse(); }
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const n = [c + dc, r + dr], nk = key(...n); if (!prev.has(nk) && pass(...n)) { prev.set(nk, key(c, r)); q.push(n); } }
  }
  return null;
}

// ---------------------------------------------------------------- drawing
const C = 20;
const COL = { red: '#e05252', blue: '#4a8fe0', green: '#4caf50', black: '#222', gold: '#e0b84a' };
function panel(cfg, ox, oy) {
  const g = el('g', { transform: `translate(${ox},${oy})` });
  const X = c => (c - 1) * C, Y = r => (r - R0) * C + 44;
  el('text', { x: 0, y: 16, 'font-size': 17, fill: '#ffe9a8', 'font-weight': 'bold' }, cfg.title, g);
  el('text', { x: 0, y: 34, 'font-size': 12, fill: '#e8d9bd' }, cfg.sub, g);
  el('rect', { x: 0, y: Y(R0), width: 24 * C, height: (R1 - R0 + 1) * C, fill: '#8a6a45' }, null, g);
  for (let r = R0; r <= R1 + 1; r++) el('line', { x1: 0, x2: 24 * C, y1: Y(r), y2: Y(r), stroke: '#6d5236', 'stroke-width': .7 }, null, g);
  for (let c = 1; c <= 25; c++) el('line', { x1: X(c), x2: X(c), y1: Y(R0), y2: Y(R1 + 1), stroke: '#6d5236', 'stroke-width': .7 }, null, g);
  el('rect', { x: 0, y: Y(25), width: 24 * C, height: C, fill: '#d8c39a', opacity: .35 }, null, g);
  el('text', { x: 12 * C, y: Y(25) + 15, 'font-size': 11, 'text-anchor': 'middle', fill: '#2a1d12' }, "clerks' floor", g);
  // building
  for (const k of building) { const [c, r] = k.split(',').map(Number); el('rect', { x: X(c), y: Y(r), width: C, height: C, fill: r === 8 ? '#3d2c3f' : '#2a1d12' }, null, g); }
  el('text', { x: X(2), y: Y(16) + 4, 'font-size': 10, fill: '#ffd0d0', 'text-anchor': 'middle', transform: `rotate(-90 ${X(2)} ${Y(16)})` }, 'AUDITOR', g);
  el('text', { x: X(24), y: Y(16) + 4, 'font-size': 10, fill: '#ffd6f4', 'text-anchor': 'middle', transform: `rotate(-90 ${X(24)} ${Y(16)})` }, 'COLLECTOR', g);
  el('text', { x: X(5) + 2, y: Y(8) + 14, 'font-size': 10, fill: '#c8f5b8' }, 'ARCHIVE', g);
  el('text', { x: X(9), y: Y(8) + 14, 'font-size': 10, fill: '#efd9ff' }, 'DAIS', g);
  el('text', { x: X(19), y: Y(8) + 14, 'font-size': 10, fill: '#ddd' }, 'STRONGRM', g);
  // doors
  for (const [name, [c, r]] of Object.entries(DOORS)) {
    const live = cfg.target && ((cfg.target[0] === c && cfg.target[1] === r) || (cfg.target[0] === c && cfg.target[1] === r + 1) || (cfg.aisle && name.startsWith('steps')));
    el('rect', { x: X(c) + 2, y: Y(r) + 2, width: C - 4, height: C - 4, fill: live ? '#ffd84a' : '#7a6a50', stroke: live ? '#fff' : 'none', 'stroke-width': 2 }, null, g);
  }
  const B = blocked(cfg);
  // hall
  if (cfg.hall) for (const [c1, r1, c2, r2] of cfg.hall) {
    const cmin = Math.min(c1, c2), cmax = Math.max(c1, c2), rmin = Math.min(r1, r2), rmax = Math.max(r1, r2);
    el('rect', { x: X(cmin), y: Y(rmin), width: (cmax - cmin + 1) * C, height: (rmax - rmin + 1) * C, fill: '#c0392b', opacity: .28 }, null, g);
  }
  if (cfg.aisle) el('rect', { x: X(11), y: Y(9), width: 4 * C, height: 5 * C, fill: '#b08cc4', opacity: .4 }, null, g);
  // path
  const hubCentre = [12, 18];
  let path = null;
  if (cfg.key === 'lure') path = bfs(B, cfg.start, [13, 21]);
  else if (cfg.target) path = bfs(B, hubCentre, cfg.target);
  if (path) el('polyline', { points: path.map(([c, r]) => `${X(c) + C / 2},${Y(r) + C / 2}`).join(' '), fill: 'none', stroke: '#fff3b0', 'stroke-width': 3, 'stroke-dasharray': '6 4', 'stroke-linecap': 'round' }, null, g);
  // shelves
  const hub = HUB.filter(p => !(cfg.removeHub || []).includes(p));
  const drawPiece = (p, fill, stroke) => { const cs = cells(p); const [c0, r0] = cs[0], [c1, r1] = cs[cs.length - 1];
    el('rect', { x: X(c0) + 2, y: Y(r0) + 2, width: (c1 - c0 + 1) * C - 4, height: (r1 - r0 + 1) * C - 4, fill, stroke, 'stroke-width': 1.5, rx: 2 }, null, g);
    const n = cs.length; el('text', { x: (X(c0) + X(c1) + C) / 2, y: (Y(r0) + Y(r1) + C) / 2 + 3.5, 'font-size': 9, fill: '#f3e6cc', 'text-anchor': 'middle' }, n, g); };
  for (const p of hub) drawPiece(p, '#2f6f6a', '#9fe0d8');
  for (const p of cfg.pieces) drawPiece(p, LURE_SEAL.includes(p) ? '#7a2a2a' : '#4a3220', LURE_SEAL.includes(p) ? '#ff8080' : '#c9a46a');
  // colour exits
  for (const [k, [c, r]] of Object.entries(EXITS)) {
    if (cfg.aisle) { if (k === 'N') continue; el('rect', { x: X(c) + 3, y: Y(r) + 3, width: C - 6, height: C - 6, fill: '#999', stroke: '#fff', 'stroke-width': 1 }, null, g); continue; }
    if (cfg.exits) el('rect', { x: X(c) + 2, y: Y(r) + 2, width: C - 4, height: C - 4, fill: COL[cfg.exits[k]], stroke: '#fff', 'stroke-width': 2 }, null, g);
    else el('rect', { x: X(c) + 3, y: Y(r) + 3, width: C - 6, height: C - 6, fill: 'none', stroke: '#fff', 'stroke-width': 1.5, 'stroke-dasharray': '3 2' }, null, g);
  }
  // doom shelf
  if (cfg.doom) { const [c, r] = cfg.doom; el('rect', { x: X(c) + 1, y: Y(r) + 1, width: C - 2, height: C - 2, fill: 'url(#rainbow)', stroke: '#fff', 'stroke-width': 2.5 }, null, g);
    el('text', { x: X(c) + C / 2, y: Y(r) + C / 2 + 4, 'font-size': 11, 'text-anchor': 'middle', fill: '#000', 'font-weight': 'bold' }, '!', g); }
  // seal
  if (cfg.seal) { const [ca, ra, cb, rb] = cfg.seal; const vertical = ra === rb; const bx = vertical ? X(Math.max(ca, cb)) : X(ca), by = vertical ? Y(ra) : Y(Math.max(ra, rb));
    el('line', { x1: bx, y1: by, x2: vertical ? bx : bx + C, y2: vertical ? by + C : by, stroke: '#ff3b3b', 'stroke-width': 6, 'stroke-linecap': 'round' }, null, g); }
  if (cfg.key === 'lure') { el('line', { x1: X(13), y1: Y(22) + C, x2: X(14), y2: Y(22) + C, stroke: '#ff3b3b', 'stroke-width': 6, 'stroke-dasharray': '4 3' }, null, g); }
  // checks
  if (cfg.target && cfg.key !== 'lure') {
    for (const k of cfg.exitsOpen.length ? cfg.exitsOpen : ['-']) {
      const only = { ...cfg, exitsOpen: k === '-' ? [] : [k] };
      const B1 = blocked(only), p = bfs(B1, hubCentre, cfg.target);
      report.push(`${cfg.key} via ${k}: ${p ? 'reaches target in ' + (p.length - 1) : 'NO ROUTE'}`);
      if (cfg.seal) { const sb = new Set([cfg.seal[2] + ',' + cfg.seal[3]]); const p2 = bfs(B1, hubCentre, cfg.target, sb); report.push(`${cfg.key} via ${k} with seal shut: ${p2 ? 'LEAK ' + JSON.stringify(p2) : 'sealed ok'}`); }
    }
    if (cfg.hall) { const hallCells = new Set(); for (const [c1, r1, c2, r2] of cfg.hall) for (let c = Math.min(c1, c2); c <= Math.max(c1, c2); c++) for (let r = Math.min(r1, r2); r <= Math.max(r1, r2); r++) hallCells.add(c + ',' + r);
      let leak = []; for (const k of hallCells) { const [c, r] = k.split(',').map(Number); for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nk = (c + dc) + ',' + (r + dr); if (!hallCells.has(nk) && !B.has(nk) && nk !== cfg.target.join(',') && nk !== cfg.seal.slice(0, 2).join(',') && !(r + dr < 9)) leak.push(k + '→' + nk); } }
      report.push(`${cfg.key} hall: ${hallCells.size} squares, side openings: ${leak.length ? leak.join(' ') : 'none'}`); }
  }
  if (cfg.key === 'lure') { const p = bfs(B, cfg.start, [13, 21]); report.push('lure: ' + (p ? 'clerks floor → hub in ' + (p.length - 1) : 'NO ROUTE')); }
  // count pieces
  const all = [...hub, ...cfg.pieces]; const cnt = { 2: 0, 4: 0, 6: 0 }; for (const p of all) cnt[+p.split(' ')[0].slice(1)]++;
  return cnt;
}
const defs = el('defs', {}); defs.innerHTML = '<linearGradient id="rainbow" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#e05252"/><stop offset=".3" stop-color="#e0b84a"/><stop offset=".55" stop-color="#4caf50"/><stop offset=".8" stop-color="#4a8fe0"/><stop offset="1" stop-color="#555"/></linearGradient>';
el('text', { x: 30, y: 34, 'font-size': 26, fill: '#f3e6cc', 'font-weight': 'bold' }, 'The Filing Stacks: how the shelf maze moves');
const counts = [];
CONFIGS.forEach((cfg, i) => counts.push(panel(cfg, 30 + (i % 3) * 510, 60 + Math.floor(i / 3) * 470)));
const need = { 2: 0, 4: 0, 6: 0 }; for (const c of counts) for (const k in c) need[k] = Math.max(need[k], c[k]);
window.REPORT = report; window.NEED = need;

// ---------------------------------------------------------------- row 3: the doom hall, step by step
(function () {
  const ox = 30, oy = 1010, CC = 30, g = el('g', { transform: `translate(${ox},${oy})` });
  el('text', { x: 0, y: 0, 'font-size': 19, fill: '#ffe9a8', 'font-weight': 'bold' }, 'The doom hall, step by step (one 1-wide hall, 14 squares)', g);
  const rows = [
    ['Party enters. The seal slams behind the last hero.', ['S', 'H', 'H', 'H', 'H', '', '', '', '', '', '', '', '', 'D'], 'door at 12'],
    ['End round 1: the shelf grinds 2 forward; 2 debtor ghosts spill out ahead of it.', ['S', 'H', 'H', 'H', 'H', '', '', '', '', 'g', 'g', 'D', '', ''], ''],
    ['Enemy phase, 5–6: it melts into the shelf wall and lunges out beside the back hero. The hall ahead is open: dash for the door!', ['S', 'H', 'H', 'H', 'H', 'g', 'g', '', '', '', '', '', '', ''], 'flank'],
    ['End round 3: back at the head and grinding on. Whoever it can no longer push is CRUSHED: 400 damage.', ['S', 'H', 'H', 'H', 'H', 'g', 'g', 'D', '', '', '', '', '', ''], ''],
  ];
  rows.forEach(([cap, cellsRow, note], i) => {
    const y = 22 + i * 84;
    el('text', { x: 0, y: y + 12, 'font-size': 13, fill: '#e8d9bd' }, cap, g);
    cellsRow.forEach((t, j) => {
      const x = j * CC, yy = y + 20;
      el('rect', { x, y: yy, width: CC, height: CC, fill: '#c0392b', 'fill-opacity': .28, stroke: '#6d5236' }, null, g);
      if (j === 12) el('rect', { x: x + 8, y: yy - 9, width: CC - 16, height: 8, fill: '#ffd84a' }, null, g);
      if (t === 'S') el('rect', { x: x + 1, y: yy + 1, width: CC - 2, height: CC - 2, fill: '#7a2a2a', stroke: '#ff3b3b', 'stroke-width': 3 }, null, g);
      if (t === 'H') el('circle', { cx: x + CC / 2, cy: yy + CC / 2, r: 10, fill: '#5fa8ff', stroke: '#fff', 'stroke-width': 1.5 }, null, g);
      if (t === 'g') el('circle', { cx: x + CC / 2, cy: yy + CC / 2, r: 8, fill: '#cfe8ff', stroke: '#1b1712', 'stroke-width': 1.5 }, null, g);
      if (t === 'D') el('rect', { x: x + 2, y: yy + 2, width: CC - 4, height: CC - 4, fill: 'url(#rainbow)', stroke: '#fff', 'stroke-width': 2.5 }, null, g);
    });
    if (note === 'flank') { el('rect', { x: 1 * CC + 2, y: y + 20 + CC + 2, width: CC - 4, height: CC - 4, fill: 'url(#rainbow)', stroke: '#fff', 'stroke-width': 2.5 }, null, g);
      el('text', { x: 2 * CC + 6, y: y + 20 + CC + 18, 'font-size': 11, fill: '#ffe9a8' }, '← out of the wall, beside the back hero', g); }
  });
  const lx = 0, ly = 380; let lxx = 0;
  [['#7a2a2a', 'seal'], ['#5fa8ff', 'hero'], ['#cfe8ff', 'debtor ghost'], ['url(#rainbow)', 'doom shelf (the colour they chose)'], ['#ffd84a', 'folio door']].forEach(([f, t], i) => {
    el('rect', { x: lxx, y: ly - 12, width: 16, height: 16, fill: f, stroke: '#fff' }, null, g); el('text', { x: lxx + 22, y: ly + 1, 'font-size': 12, fill: '#e8d9bd' }, t, g); lxx += 40 + t.length * 6.5; });
})();
(function () {
  const g = el('g', { transform: 'translate(1040,1010)' }); let y = 0;
  const t = (txt, size = 13, fill = '#e8d9bd', w = 'normal') => { el('text', { x: 0, y, 'font-size': size, fill, 'font-weight': w }, txt, g); y += size + 7; };
  t('What the books on each colour shelf say', 19, '#ffe9a8', 'bold'); y += 4;
  const H = [['#e05252', 'RED', 'FINAL NOTICE, stamped over and over, angrier each page', 'Enrage'],
             ['#4a8fe0', 'BLUE', 'the same sum copied out, each copy a line longer', 'Regenerate'],
             ['#4caf50', 'GREEN', 'lists of names; a new one is being written as you read', 'Summoner'],
             ['#666', 'BLACK', 'charred covers, WRITTEN OFF, the ink still smoking', 'Death Throes'],
             ['#e0b84a', 'GOLD', 'gilt-edged and iron-clasped; you cannot open it', 'Thick Hide']];
  for (const [c, n, hint, pw] of H) { el('rect', { x: 0, y: y - 13, width: 16, height: 16, fill: c, stroke: '#fff' }, null, g); el('text', { x: 24, y, 'font-size': 13, fill: '#fff8e8', 'font-weight': 'bold' }, n + ' → ' + pw, g); y += 18; el('text', { x: 24, y, 'font-size': 12, fill: '#d6c4a0', 'font-style': 'italic' }, hint, g); y += 24; }
  y += 6;
  t('Shelves to bring (the most any one layout uses)', 15, '#ffe9a8', 'bold');
  t(`1×2: ${NEED[2]}    1×4: ${NEED[4]}    1×6: ${NEED[6]}    + the five 1×1 colour shelves`, 13);
  t('Teal = the hub, which never moves. Brown = moved between runs.', 12);
})();

</script></body></html>
