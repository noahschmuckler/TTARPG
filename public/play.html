<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0c0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Delvers' Ledger · Hero</title>
<link rel="stylesheet" href="app.css">
<style>
  .top { display: flex; align-items: center; gap: 12px; }
  .crest { --c: 0px; width: 48px; height: 48px; flex: none; display: grid; place-items: center; font-size: 24px; color: var(--brass-hi);
    background: var(--brass-grad); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); position: relative; isolation: isolate; }
  .crest.pic { width: 56px; height: 56px; }
  .crest.pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .crest::before { content: ''; position: absolute; inset: 2px; z-index: -1; clip-path: inherit; background: radial-gradient(circle, #2f281a, #0f0d09); }
  .top .name { font-family: var(--carved); font-weight: 800; font-size: 22px; line-height: 1.05; color: var(--brass-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .cls { font-family: var(--display); font-weight: 600; letter-spacing: .18em; text-transform: uppercase; font-size: 12px; color: var(--ink-dim); }
  .round { text-align: center; line-height: 1; }
  .round b { display: block; font-family: var(--display); font-weight: 900; font-size: 26px; color: var(--brass-hi); }
  .round small { font-family: var(--display); letter-spacing: .2em; font-size: 10px; color: var(--ink-dim); text-transform: uppercase; }

  /* Orbs */
  .orbs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 18px 0 6px; }
  .orbwrap { text-align: center; }
  .bezel { position: relative; width: min(100%, 176px); aspect-ratio: 1; margin: 0 auto; padding: 9px; isolation: isolate;
    background: var(--brass-grad);
    clip-path: polygon(29% 0, 71% 0, 100% 29%, 100% 71%, 71% 100%, 29% 100%, 0 71%, 0 29%); }
  .bezel::before { content: ''; position: absolute; inset: 3px; z-index: -1; clip-path: inherit;
    background: repeating-conic-gradient(from -4deg, #2b2417 0 8deg, #15120c 8deg 15deg); }
  .orb { position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #070605;
    box-shadow: inset 0 0 0 2px var(--brass-lo), inset 0 0 22px #000; }
  .liquid { position: absolute; left: 0; right: 0; bottom: 0; height: 50%; transition: height .6s cubic-bezier(.2,.8,.2,1); }
  .liquid::before { content: ''; position: absolute; left: -10%; right: -10%; top: -7px; height: 14px; border-radius: 50%; background: inherit; filter: brightness(1.35); opacity: .9; }
  .hp .liquid { background: radial-gradient(circle at 50% 120%, #ff6b77, #c4293a 45%, #5c0e18 100%); }
  .en .liquid { background: radial-gradient(circle at 50% 120%, #b4fff7, #2fb9ab 45%, #0a3a36 100%); }
  .orb .glass { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.35), transparent 28%), radial-gradient(circle at 50% 50%, transparent 55%, rgba(0,0,0,.55)); pointer-events: none; }
  .orb .val { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-shadow: 0 2px 3px #000, 0 0 10px #000; }
  .orb .val b { font-family: var(--display); font-weight: 900; font-size: clamp(30px, 10vw, 44px); line-height: 1; }
  .orb .val small { font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .06em; color: #ddd3bb; }
  .orbwrap .lab { margin-top: 6px; font-family: var(--display); font-weight: 800; letter-spacing: .26em; text-transform: uppercase; font-size: 13px; color: var(--ink-dim); }
  .ward { position: absolute; z-index: 2; left: 50%; bottom: -2px; transform: translateX(-50%); padding: 2px 10px; background: #e7e2d6; color: #1b1912;
    font-family: var(--display); font-weight: 900; font-size: 13px; letter-spacing: .08em; clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 8px 100%, 0 50%); }
  .down .orb { filter: grayscale(1) brightness(.6); }

  .buff { margin-top: 12px; text-align: center; padding: 10px; --plate-bg: #12261f; color: #c9fff6; font-weight: 600; }
  .defend { width: 100%; min-height: 76px; font-size: 22px; margin-top: 14px; --c: 18px; animation: throb 1.2s ease-in-out infinite; }
  @keyframes throb { 50% { filter: drop-shadow(0 0 14px rgba(255,90,103,.7)); } }
  .grp { margin-top: 16px; padding-top: 12px; border-top: 1px solid #2a2519; }
  .grp .gn { font-family: var(--carved); font-weight: 800; font-size: 18px; color: #ffb27d; }
  .incoming { margin-top: 16px; text-align: center; font-family: var(--display); font-weight: 800; letter-spacing: .08em; font-size: 20px; color: #ff9ca4; }
  .attack { width: 100%; min-height: 76px; font-size: 24px; margin-top: 14px; --c: 18px; }
  .attack .dice { display: inline-flex; gap: 4px; }
  .die { width: 18px; height: 18px; border-radius: 4px; background: #1b150a; display: inline-block; position: relative; }
  .die::after { content: ''; position: absolute; inset: 0; margin: auto; width: 5px; height: 5px; border-radius: 50%; background: var(--brass-hi); }

  .foes { display: flex; flex-wrap: wrap; gap: 10px; }
  .minion { width: 58px; height: 58px; border: 0; position: relative; isolation: isolate; display: grid; place-items: center;
    background: linear-gradient(160deg, #e98f53, #6e3818); clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
    font-size: 24px; color: #ffd9bf; transition: transform .1s; }
  .minion::before { content: ''; position: absolute; inset: 2px; z-index: -1; clip-path: inherit; background: radial-gradient(circle, #3b1f10, #170b05); }
  .minion:active { transform: scale(.86); }
  .minion.dying { animation: die .35s forwards; }
  @keyframes die { to { transform: scale(1.6) rotate(30deg); opacity: 0; } }
  .bigfoe { width: 100%; padding: 12px 14px; --plate-bg: #1f130b; }
  .bigfoe .nm { font-family: var(--carved); font-weight: 800; color: #ffb27d; font-size: 18px; }

  .pool { margin-top: 14px; padding: 12px 14px; --plate-bg: #2a2110; text-align: center; }
  .pool .ph { font-family: var(--display); font-weight: 900; font-size: 30px; letter-spacing: .06em; color: var(--brass-hi); line-height: 1; }
  .pool .ps { font-family: var(--display); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: 13px; color: var(--ink-dim); margin-top: 4px; }
  .armed .minion { animation: ready 1s ease-in-out infinite; }
  .armed .bigfoe { cursor: pointer; animation: ready 1s ease-in-out infinite; }
  @keyframes ready { 50% { filter: drop-shadow(0 0 8px rgba(243,217,142,.7)); } }
  .others { margin-top: 12px; }
  .ogrp { display: inline-flex; align-items: center; gap: 8px; margin: 0 8px 8px 0; padding: 6px 10px 6px 6px; border: 1px solid #6e3818; background: #1f130b; color: #ffcfa8; font-family: var(--display); font-weight: 800; letter-spacing: .04em; }
  .ogrp .minion { width: 40px; height: 40px; font-size: 17px; flex: none; }
  .ogrp { cursor: pointer; min-height: 56px; text-align: left; line-height: 1.15; font-size: 15px; }
  .ogrp small { font-weight: 600; letter-spacing: .06em; color: #c99d7d; font-size: 12px; }
  .mtile { border: 1px solid #6e3818; background: #1f130b; padding: 8px 6px 6px; min-width: 84px; min-height: 92px; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; color: #ffcfa8; transition: transform .1s; }
  .mtile:active { transform: scale(.92); }
  .mtile.dying { animation: die .35s forwards; }
  .mtile.pinned { outline: 2px dashed #9fd0ff; outline-offset: 2px; }
  .mtile .mname { font-family: var(--display); font-weight: 800; letter-spacing: .04em; font-size: 13px; line-height: 1.1; max-width: 90px; text-align: center; }
  .armed .mtile .minion { animation: ready 1s ease-in-out infinite; }
  .armed .mtile, .armed .ogrp { border-color: var(--brass); }
  .float { position: fixed; left: 50%; top: 38%; z-index: 75; pointer-events: none; transform: translateX(-50%); font-family: var(--display); font-weight: 900; font-size: 34px; letter-spacing: .04em; color: var(--brass-hi); text-shadow: 0 0 18px rgba(243,217,142,.6), 0 3px 0 #000; animation: floatup .8s forwards; white-space: nowrap; }
  .float.crit { color: #ffb27d; font-size: 44px; }
  @keyframes floatup { from { opacity: 0; transform: translate(-50%, 20px) scale(.8); } 20% { opacity: 1; transform: translate(-50%, 0) scale(1.05); } to { opacity: 0; transform: translate(-50%, -50px); } }
  .tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

  .powers { display: grid; gap: 10px; }
  .power { text-align: left; border: 0; padding: 12px 14px; --plate-bg: var(--basalt); width: 100%; }
  .power .pn { font-family: var(--carved); font-weight: 800; font-size: 18px; color: var(--ink-dim); }
  .power .pt { font-size: 14px; color: var(--ink-faint); margin: 2px 0 8px; }
  .power .cost { font-family: var(--display); font-weight: 900; font-size: 22px; color: var(--ink-faint); }
  .power .bar { height: 10px; }
  .power.ready { --plate-bg: #10241f; animation: glow 1.8s ease-in-out infinite; }
  .power.ready .pn { color: #c9fff6; } .power.ready .pt { color: var(--ink-dim); } .power.ready .cost { color: var(--aether); }
  @keyframes glow { 50% { filter: drop-shadow(0 0 10px rgba(79,209,197,.55)); } }

  .gear { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .slot { aspect-ratio: 1; border: 1px solid var(--line); background: var(--basalt); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px; text-align: center;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
  .slot .sl { font-family: var(--display); letter-spacing: .12em; text-transform: uppercase; font-size: 10px; color: var(--ink-faint); }
  .slot .sn { font-family: var(--carved); font-weight: 800; font-size: 11px; line-height: 1.1; color: var(--rc, var(--ink-faint)); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .slot.filled { border-color: var(--rc); background: radial-gradient(circle, color-mix(in srgb, var(--rc) 18%, transparent), var(--basalt)); }
  .bag { display: grid; gap: 8px; margin-top: 10px; }
  .bag button { border: 0; padding: 0; background: none; text-align: left; width: 100%; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 18px; font-size: 15px; }
  .stats div { display: flex; justify-content: space-between; border-bottom: 1px solid #2a2519; padding: 5px 0; }
  .stats b { font-family: var(--display); font-weight: 800; font-size: 17px; }
  .log { font-size: 14px; color: var(--ink-dim); }
  .log div { padding: 5px 0; border-bottom: 1px solid #221e15; }
  .log .kill { color: #ffcfa8; } .log .loot { color: var(--r-rare); } .log .hurt { color: #ff9ca4; } .log .ability { color: #aef7ee; } .log .round { color: var(--brass); text-align: center; }

  /* Attack sheet */
  .pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; }
  .pick button { height: 62px; border: 1px solid var(--line); background: var(--obsidian); font-family: var(--display); font-weight: 900; font-size: 28px;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
  .pick button.on { background: var(--brass); color: #1b150a; border-color: var(--brass-hi); }
  .targets { display: flex; flex-wrap: wrap; gap: 8px; }
  .instr { font-size: 19px; margin: 14px 0 10px; }
  .instr b { color: var(--brass-hi); font-family: var(--display); font-size: 24px; }

  .classes { display: grid; gap: 10px; }
  .cls-card { text-align: left; border: 0; width: 100%; padding: 12px 14px; --plate-bg: var(--basalt); }
  .cls-card.on { --plate-bg: #2c2514; }
  .cls-card .cn { font-family: var(--carved); font-weight: 800; font-size: 20px; color: var(--brass-hi); }
  .cls-card .ab { font-size: 13px; color: var(--ink-dim); margin-top: 4px; }

  .reveal { position: fixed; inset: 0; z-index: 90; background: rgba(5,4,3,.92); display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 20px; overflow: hidden; animation: fade .3s; }
  .reveal .sunburst { inset: -60%; opacity: 1; }
  .reveal .card { position: relative; width: 100%; max-width: 380px; animation: pop .6s; }
  .reveal .hdr { position: relative; font-family: var(--display); font-weight: 900; letter-spacing: .3em; text-transform: uppercase; color: var(--rc); font-size: 22px; margin-bottom: 14px; text-shadow: 0 0 18px var(--rc); }
  .reveal .acts { position: relative; display: flex; gap: 10px; width: 100%; max-width: 380px; margin-top: 16px; }
  .shake { animation: shake .4s; }
  .rulesbtn { flex: none; display: grid; place-items: center; height: 30px; padding: 0 10px; border: 1px solid var(--brass-lo); color: var(--brass-hi); text-decoration: none; font-family: var(--display); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; background: #1b170f; }
  .moveline { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; margin-top: 6px; font-family: var(--display); letter-spacing: .08em; text-transform: uppercase; font-size: 13px; color: var(--ink-dim); }
  .moveline b { color: var(--ink); font-size: 15px; }
  .hiddenbadge { color: #c8b6ff; border: 1px solid #6b5aa8; padding: 0 6px; background: #1d1830; }
  .pinbadge { font-family: var(--display); font-size: 12px; letter-spacing: .08em; color: #9fd0ff; }
  .minion.pinned { outline: 2px dashed #9fd0ff; outline-offset: 2px; }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px; }
  .tog { padding: 8px 12px; border: 1px solid var(--line); background: var(--obsidian); font-family: var(--display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; color: var(--ink-dim); }
  .tog b { color: var(--brass-hi); }
  .tog.on { background: #2c2514; border-color: var(--brass); color: var(--ink); }
  .tog.fixed { background: #1d1830; border-color: #6b5aa8; color: #c8b6ff; }
  .tgrp { margin-top: 8px; }
  .tgrp .tl { font-family: var(--display); letter-spacing: .14em; text-transform: uppercase; font-size: 11px; color: var(--ink-faint); margin-bottom: 4px; }
  .tlist { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .minion.tsel { width: 48px; height: 48px; font-size: 20px; opacity: .55; }
  .minion.tsel.hit { opacity: 1; filter: drop-shadow(0 0 6px rgba(243,217,142,.9)); }
  .minion.tsel.slam { opacity: 1; filter: drop-shadow(0 0 8px rgba(255,120,60,1)); color: #ffd2b0; }
  .bigsel { padding: 8px 12px; border: 1px solid #6e3818; background: #1f130b; color: #ffcfa8; font-family: var(--carved); font-weight: 800; opacity: .6; }
  .bigsel.hit { opacity: 1; border-color: var(--brass-hi); box-shadow: 0 0 8px rgba(243,217,142,.6); }
  .bigsel.slam { opacity: 1; border-color: #ff8a3d; background: #3b1a0c; box-shadow: 0 0 10px rgba(255,138,61,.8); }
  .ptag { font-family: var(--display); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 10px; padding: 1px 5px; border: 1px solid var(--line); color: var(--ink-faint); margin-left: 6px; vertical-align: 3px; }
  .fabs { margin-top: 8px; display: grid; gap: 4px; }
  .fab { font-size: 13px; color: var(--ink-faint); line-height: 1.3; }
  .fab b { color: #e9a77f; font-family: var(--display); letter-spacing: .06em; font-weight: 700; }
  .fab.fired b { color: #fff; background: #8a2b1a; padding: 0 5px; }
  .foealert { position: fixed; left: 12px; right: 12px; top: 18%; z-index: 85; pointer-events: none; text-align: center; padding: 16px 12px;
    background: linear-gradient(180deg, rgba(90,20,15,.96), rgba(40,8,6,.96)); border-top: 2px solid #ff8a3d; border-bottom: 2px solid #ff8a3d; animation: pop .35s; transition: opacity .4s; }
  .foealert.out { opacity: 0; }
  .foealert .fa-big { font-family: var(--display); font-weight: 900; font-size: 30px; letter-spacing: .1em; text-transform: uppercase; color: #ffd2b0; text-shadow: 0 0 16px rgba(255,138,61,.7); }
  .foealert .fa-small { margin-top: 6px; font-size: 16px; color: #ffe9da; }
  .reveal.unlock { z-index: 95; }
  .rak { display: flex; flex-direction: column; align-items: center; }
  .rakpic { width: 92px; height: 92px; object-fit: cover; border-radius: 50%; border: 2px solid var(--brass); box-shadow: 0 0 24px rgba(255,170,70,.35); }
  .rakpic.sm { width: 34px; height: 34px; border-width: 1px; box-shadow: none; vertical-align: middle; }
  .stallbtn { margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .stallbtn .fav { font-family: var(--display); font-weight: 900; }
  .favbig { font-family: var(--display); font-weight: 900; font-size: 34px; color: var(--brass-hi); margin: 4px 0 0; } .favbig small { font-size: 14px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-dim); }
  .srow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #2a2519; } .srow .faint { font-size: 13px; }
  .srow .btn[disabled] { opacity: .45; }
  .wares { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .wares .wl { font-family: var(--display); letter-spacing: .14em; text-transform: uppercase; font-size: 12px; color: var(--ink-dim); margin-right: 4px; } .wares .wl b { color: var(--brass-hi); }
  .ware { background: none; border: 0; padding: 0; cursor: pointer; } .ware:active { transform: scale(.9); }
  .reveal.crown { z-index: 92; justify-content: flex-start; overflow-y: auto; padding: 18px 12px 30px; }
  .reveal.crown .sunburst { position: fixed; opacity: .35; }
  .crown .ct { position: relative; width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }
  .crown .hdr { --rc: var(--brass-hi); text-align: center; }
  .rakline { font-style: italic; color: #efe6d2; text-align: center; margin: 0 0 10px; font-size: 16px; }
  .lbl2 { font-family: var(--display); letter-spacing: .16em; text-transform: uppercase; font-size: 13px; color: var(--ink-dim); margin: 8px 0 6px; } .lbl2 b { color: var(--brass-hi); }
  .hand { display: flex; gap: 8px; justify-content: center; }
  .cslot { background: none; border: 0; padding: 0; position: relative; transition: transform .15s; cursor: pointer; }
  .cslot.pick { transform: translateY(-12px); filter: drop-shadow(0 0 10px rgba(95,211,196,.9)); }
  .swaptag { position: absolute; left: 50%; bottom: -4px; transform: translateX(-50%); font-family: var(--display); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-size: 11px; background: var(--aether); color: #04110f; padding: 1px 6px; }
  .pcard.flip { animation: cflip .6s ease-out; } @keyframes cflip { from { transform: rotateY(90deg); } to { transform: rotateY(0); } }
  .stake { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 12px; font-size: 15px; }
  .wpick { display: inline-flex; gap: 4px; } .wpick button { min-width: 38px; min-height: 38px; border: 1px solid var(--brass); background: #1a150c; color: var(--brass-hi); font-family: var(--display); font-weight: 900; font-size: 18px; } .wpick button.on { background: var(--brass); color: #120e07; }
  .verdict { margin: 14px 0 4px; font-family: var(--display); font-weight: 900; font-size: 24px; text-align: center; color: var(--ink); } .verdict.win { color: var(--aether); text-shadow: 0 0 16px rgba(95,211,196,.6); } .verdict.lose { color: #ff9ca4; }
  .others2 { margin-top: 10px; width: 100%; } .orow { font-size: 14px; color: var(--ink-dim); text-align: center; padding: 2px 0; } .orow.win { color: var(--aether); } .orow.lose { color: #ff9ca4; }
  .ranks { margin-top: 10px; font-size: 13px; color: var(--ink-dim); text-align: center; } .ranks summary { cursor: pointer; color: var(--brass); }
  .reveal.syn .hdr { font-size: 20px; letter-spacing: .22em; text-align: center; animation: synglow 1.6s ease-in-out infinite; }
  .reveal.syn .card .plate { box-shadow: 0 0 0 2px #e7d9ff, 0 0 40px rgba(200,170,255,.55); animation: synpulse 1.6s ease-in-out infinite; }
  .reveal.syn .synsub { font-family: var(--display); letter-spacing: .3em; text-transform: uppercase; font-size: 12px; color: #c9b8ff; margin-bottom: 6px; }
  .reveal .btn[disabled] { opacity: .45; }
  @keyframes synglow { 50% { text-shadow: 0 0 32px #c9a8ff, 0 0 8px #fff; } }
  @keyframes synpulse { 50% { box-shadow: 0 0 0 2px #fff, 0 0 70px rgba(200,170,255,.85); } }
  .synline { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 6px 0 2px; }
  .synline span { font-family: var(--display); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; color: #e7d9ff; border: 1px solid #8f7bc9; padding: 3px 9px; background: rgba(120,90,200,.18); }
  .reveal.cache { justify-content: flex-start; overflow-y: auto; padding-top: 40px; }
  .reveal.cache .hdr { font-size: 17px; letter-spacing: .18em; text-align: center; }
  .reveal.cache .sunburst { position: fixed; }
  .cachelist { position: relative; display: grid; gap: 10px; width: 100%; max-width: 380px; }
  .cachelist .card { animation: pop .5s backwards; }
  .iacts { display: flex; gap: 8px; margin-top: 10px; }
  .pset { font-family: var(--display); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 11px; margin-bottom: 2px; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="center dim" style="margin-top:40vh">Opening the ledger…</p></div>
<script type="module">
import { CLASSES, SLOTS, SLOT_LABEL, STAT_INFO, RARITIES, ENEMY_TYPES, FOE_ABILITIES, SETS, HIDDEN_DICE, derive, engagedWith, strikeLeft, powersFor, reachText, fmt, activeSynergies, tallyOf } from './engine.js';
import { BOONS, CONSUMABLES, SELL_VALUE, boonPrice, boonLocked, scoreHand, handName } from './merchant.js';
import { cardSVG, cardBackSVG, consumableSVG } from './art.js';
let seenDefense = null, defenseOpen = false;
import { $, h, esc, params, connect, toast, burst, sheet, itemHTML, setsHTML, boardMapSVG, heroIcon } from './ui.js';

const room = (params.get('room') || '').toUpperCase();
if (!room) location.href = './';
localStorage.setItem('dl.lastRoom', room);
const KEY = `dl.char.${room}`;
// ?new=1 (the join link / QR) always opens hero creation, even on a phone that already has a hero here.
if (params.has('new')) { localStorage.removeItem(KEY); history.replaceState(null, '', `play.html?room=${room}`); }
let me = params.get('as') || (params.has('new') ? null : localStorage.getItem(KEY));
let S = null, online = false, lastLog = 0;
let pendingClaim = params.get('claim');
let built = false;

const net = connect({
  room, role: 'player',
  onState: st => { S = st; render(); tryClaim(); },
  onEvents: evs => evs.forEach(onEvent),
  onStatus: on => { online = on; const d = $('.conn'); if (d) d.classList.toggle('on', on); },
});
const act = a => net.act(a);

function tryClaim() {
  if (!pendingClaim || !S || !S.characters[me]) return;
  const card = pendingClaim; pendingClaim = null;
  history.replaceState(null, '', `play.html?room=${room}`);
  act({ type: 'claimLoot', charId: me, card }).catch(() => {});
}

// Foe ability alerts can arrive in bunches (e.g. Enrage + Call the Horde): show them one after another.
const alerts = [];
let alerting = false;
function queueAlert(big, small) {
  alerts.push([big, small]);
  if (!alerting) nextAlert();
}
function nextAlert() {
  const a = alerts.shift();
  if (!a) { alerting = false; return; }
  alerting = true;
  const el = h(`<div class="foealert"><div class="fa-big">${esc(a[0])}</div><div class="fa-small">${esc(a[1])}</div></div>`);
  document.body.appendChild(el);
  if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
  setTimeout(() => { el.classList.add('out'); }, 2300);
  setTimeout(() => { el.remove(); nextAlert(); }, 2700);
}

function floatText(text, cls = '') {
  const f = h(`<div class="float ${cls}">${esc(text)}</div>`);
  document.body.appendChild(f);
  if (navigator.vibrate) navigator.vibrate(15);
  setTimeout(() => f.remove(), 850);
}

// ---------------------------------------------------------- events
function onEvent(e) {
  const mine = e.charId === me;
  const who = S?.characters[e.charId]?.name || 'Someone';
  if (e.type === 'rolled' && mine) burst(e.hits ? `${e.hits} hit${e.hits > 1 ? 's' : ''}` : 'Miss', e.hits ? 'tap foes to spend them' : 'the foes stand firm', e.hits ? '' : 'hurt');
  else if (e.type === 'kills' && mine) floatText(`☠ +${e.energy}⚡`);
  else if (e.type === 'strike' && mine) e.slain ? burst('Felled!', `${e.enemyName} · +${e.energy} energy`) : floatText(`${e.crit ? 'CRIT ' : ''}−${fmt(e.damage)}`, e.crit ? 'crit' : '');
  else if (e.type === 'hurt' && mine) {
    burst(`−${fmt(e.net)}`, [e.blocked && `${fmt(e.blocked)} blocked`, e.warded && `${fmt(e.warded)} warded`].filter(Boolean).join(' · '), 'hurt');
    document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake');
  }
  else if (e.type === 'defended' && mine) burst('Unscathed', 'every blow turned aside', 'energy');
  else if (e.type === 'heal' && mine) burst(`+${fmt(e.amount)}`, 'health restored', 'energy');
  else if (e.type === 'loot' && mine) reveal(e.item, e.from);
  else if (e.type === 'merchant') rakSay(e.open ? 'The Rakshasa is here!' : 'The Rakshasa packs up', e.line, e.open ? 'Tap “Visit the stall” on your sheet.' : '');
  else if (e.type === 'sold' && mine) { floatText(`+${e.favour} ⟡`); toast(`“${e.line}”`); }
  else if (e.type === 'boon' && mine) { burst(e.name, e.text, 'energy'); toast(`“${e.line}”`); }
  else if (e.type === 'consumable' && mine) rakSay(e.granted ? `A gift: ${e.name}` : e.name, e.line, CONSUMABLES[e.key]?.text || '', consumableSVG(e.key, 88));
  else if (e.type === 'used' && mine) burst(e.name, e.text, 'energy');
  else if (e.type === 'narrate') sheet(`${e.title ? `<h2 class="center">${esc(e.title)}</h2>` : ''}<p class="narr">${esc(e.text).replace(/\n/g, '<br>')}</p>`);
  else if (e.type === 'cache' && mine) revealCache(e.items, e.label, e.kind);
  else if (e.type === 'foeAbility') queueAlert(`${FOE_ABILITIES[e.key].icon} ${e.name}`, `${e.enemyName} · ${e.text}`);
  else if (e.type === 'unlock' && mine) revealUnlock(e);
  else if (e.type === 'unlock' && e.kind === 'synergy') { burst(`⟡ ${e.name}`, `${who} discovered a hidden synergy!`, 'energy'); toast(`${who} discovered a hidden synergy: ${e.name}!`); }
  else if (e.type === 'cache' && !mine) toast(`${who} opened ${e.label || 'a cache'} (${e.items.length} items)`);
  else if (e.type === 'ability' && !mine) toast(`${who} unleashes ${e.name}`);
  else if (e.type === 'ability' && mine) burst(e.name, 'unleashed', 'energy');
  else if (e.type === 'round') toast(`Round ${e.round} — your energy surges`);
  else if (e.type === 'spawn' && e.target === me) toast('Foes close in on you!', 'err');
}

// ---------------------------------------------------------- choose hero
function existingHTML() {
  const free = S.order.map(id => S.characters[id]);
  return free.length ? `<p class="dim center">Already in the party? Tap your hero.</p>
      <div class="classes">${free.map(c => `<button class="plate cls-card" data-claim="${c.id}"><div class="cn">${esc(c.name)}</div><div class="ab">${CLASSES[c.cls].name} · ${CLASSES[c.cls].role}</div></button>`).join('')}</div>
      <div class="rule"><span class="gem"></span>Or forge a new hero<span class="gem"></span></div>` : `<h2 class="carved center" style="color:var(--brass-hi);margin:24px 0 6px">Forge your hero</h2>`;
}
function chooser() {
  if ($('#chooser')) { $('#ex').innerHTML = existingHTML(); return; }
  built = false;
  let cls = 'ironclad';
  const app = $('#app');
  app.innerHTML = `<div id="chooser">
    <div class="rule"><span class="gem"></span>Game ${esc(room)}<span class="gem"></span></div>
    <div id="ex">${existingHTML()}</div>
    <label class="lbl" for="nm">Hero name</label>
    <input id="nm" class="field" maxlength="24" placeholder="e.g. Brokk Ironbeard" autocomplete="off">
    <label class="lbl">Calling</label>
    <div class="classes" id="cl"></div>
    <div style="height:14px"></div>
    <button class="btn solid block attack" id="go">Enter the delve</button></div>`;
  const drawClasses = () => {
    $('#cl').innerHTML = Object.entries(CLASSES).map(([k, C]) => `
      <button class="plate cls-card ${k === cls ? 'on' : ''}" data-cls="${k}">
        <div class="row"><div class="cn grow">${C.glyph} ${C.name}</div><span class="faint" style="font-size:13px">${C.role}</span></div>
        <div class="ab">Move ${C.base.move}″ · ${C.base.reach ? `range ${C.base.reach}″` : 'melee'} · Health ${fmt(C.base.maxHp)} · Armor ${C.base.armor}% · <b style="color:var(--brass)">${C.base.dice} dice</b> · Hit ${fmt(C.base.damage)}</div>
        ${k === cls ? `<div class="ab">${C.abilities.map(a => `<b>${a.name}</b>: ${a.text}`).join('<br>')}</div>` : ''}
      </button>`).join('');
  };
  drawClasses();
  app.onclick = async e => {
    const c = e.target.closest('[data-cls]');
    if (c) { cls = c.dataset.cls; drawClasses(); return; }
    const cl = e.target.closest('[data-claim]');
    if (cl) { me = cl.dataset.claim; localStorage.setItem(KEY, me); app.onclick = null; render(); tryClaim(); return; }
    if (e.target.closest('#go')) {
      const name = $('#nm').value.trim();
      if (!name) return toast('Name your hero', 'err');
      const r = await act({ type: 'createCharacter', name, cls });
      me = r.charId; localStorage.setItem(KEY, me); app.onclick = null; render(); tryClaim();
    }
  };
}

// ---------------------------------------------------------- main sheet
function skeleton() {
  $('#app').innerHTML = `
    <div class="top">
      <div class="crest" id="crest"></div>
      <div class="grow"><div class="name" id="nm"></div><div class="cls" id="cls"></div></div>
      <a class="rulesbtn" href="rules.html" title="Rules">Rules</a>
      <div class="round"><b id="rnd"></b><small>Round</small></div>
      <div class="conn ${online ? 'on' : ''}" title="connection"></div>
    </div>
    <div class="orbs">
      <div class="orbwrap hp" id="hpw"><div class="bezel"><div class="orb"><div class="liquid" id="hpl"></div><div class="glass"></div><div class="val"><b id="hpv"></b><small id="hpm"></small></div></div><div class="ward hidden" id="ward"></div></div><div class="lab">Health</div></div>
      <div class="orbwrap en"><div class="bezel"><div class="orb"><div class="liquid" id="enl"></div><div class="glass"></div><div class="val"><b id="env"></b><small id="enm"></small></div></div></div><div class="lab">Energy</div></div>
    </div>
    <div class="moveline" id="moveline"></div>
    <div id="synline"></div>
    <div id="stallbtn"></div>
    <div id="buff"></div>
    <div id="wares"></div>
    <div id="defbox"></div>
    <button class="btn solid attack" id="atk"></button>
    <div id="foes"></div>
    <div id="boardbox"></div>
    <div id="party"></div>
    <div class="rule"><span class="gem"></span>Powers<span class="gem"></span></div>
    <div class="powers" id="powers"></div>
    <div class="rule"><span class="gem"></span>Gear<span class="gem"></span></div>
    <div class="gear" id="gear"></div>
    <div class="bag" id="bag"></div>
    <div class="rule"><span class="gem"></span>Sets &amp; Synergies<span class="gem"></span></div>
    <div id="sets"></div>
    <div class="row" style="margin-top:10px"><input class="field grow" id="claimCode" placeholder="Treasure code" maxlength="6" style="text-transform:uppercase"><button class="btn sm" id="claimBtn">Claim</button></div>
    <div class="rule"><span class="gem"></span>Attributes<span class="gem"></span></div>
    <div class="stats" id="stats"></div>
    <div class="rule"><span class="gem"></span>Chronicle<span class="gem"></span></div>
    <div class="log" id="log"></div>
    <div style="height:24px"></div>
    <button class="btn sm block" id="switch">Switch hero</button>`;
  built = true;
  const app = $('#app');
  app.onclick = e => {
    const t = e.target;
    if (t.closest('#atk')) return attackSheet();
    if (t.closest('#defend')) return defenseSheet();
    const mt = t.closest('[data-mate]');
    if (mt) return mateSheet(mt.dataset.mate);
    const tgt = t.closest('[data-spend]');
    if (tgt) {
      const ch = S.characters[me];
      if (!strikeLeft(ch)) return toast('Roll an attack first, then tap foes to spend your hits');
      const big = tgt.dataset.big === '1';
      if (big && !(ch.strike.hits || ch.strike.crits)) return toast('Those hits only work on minions');
      if (tgt.classList.contains('minion') || tgt.classList.contains('mtile')) tgt.classList.add('dying');
      return act({ type: 'spend', charId: me, enemyId: tgt.dataset.spend }).catch(() => tgt.classList.remove('dying'));
    }
    if (t.closest('#endAtk')) return act({ type: 'endAttack', charId: me });
    if (t.closest('#breakaway')) return breakawaySheet();
    const p = t.closest('[data-power]');
    if (p) return powerSheet(p.dataset.power);
    const sl = t.closest('[data-slot]');
    if (sl) return slotSheet(sl.dataset.slot);
    const b = t.closest('[data-bag]');
    if (b) return bagSheet(b.dataset.bag);
    if (t.closest('#claimBtn')) { const v = $('#claimCode').value.trim(); if (v) act({ type: 'claimLoot', charId: me, card: v }).then(() => $('#claimCode').value = '').catch(() => {}); return; }
    if (t.closest('#openStall')) return stallSheet();
    const wr = t.closest('[data-ware]');
    if (wr) return wareSheet(wr.dataset.ware);
    if (t.closest('#switch')) { localStorage.removeItem(KEY); me = null; render(); }
  };
}

function render() {
  if (!S) return;
  const ch = S.characters[me];
  if (!ch) { if (me && params.get('as')) toast('That hero no longer exists', 'err'); return chooser(); }
  if (!built) skeleton();
  const C = CLASSES[ch.cls], s = derive(ch);
  document.title = `${ch.name} · Delvers' Ledger`;
  if ($('#crest').dataset.p !== (ch.portrait || C.glyph)) { $('#crest').dataset.p = ch.portrait || C.glyph; $('#crest').innerHTML = heroIcon(ch, esc(C.glyph), 56); $('#crest').classList.toggle('pic', !!ch.portrait); }
  $('#nm').textContent = ch.name;
  $('#cls').textContent = `${C.name} · ${tallyLine(ch)}`;
  $('#moveline').innerHTML = `<span>👣 Move <b>${s.move}″</b></span><span>${s.reach ? '➶' : '⚔'} Reach <b>${reachText(s.reach)}</b></span>${ch.hidden ? `<span class="hiddenbadge">◐ Hidden · +${HIDDEN_DICE} dice</span>` : ''}`;
  const syns = activeSynergies(ch);
  $('#synline').innerHTML = syns.length ? `<div class="synline">${syns.map(sy => `<span>⟡ ${esc(sy.name)}</span>`).join('')}</div>` : '';
  $('#rnd').textContent = S.round;
  $('#hpl').style.height = `${(ch.hp / s.maxHp) * 100}%`;
  $('#hpv').textContent = fmt(ch.hp);
  $('#hpm').textContent = `/ ${fmt(s.maxHp)}`;
  $('#hpw').classList.toggle('down', ch.hp <= 0);
  $('#ward').classList.toggle('hidden', !ch.ward);
  $('#ward').textContent = `⛨ ${fmt(ch.ward)}`;
  $('#enl').style.height = `${(ch.energy / s.maxEnergy) * 100}%`;
  $('#env').textContent = fmt(ch.energy);
  $('#enm').textContent = `/ ${fmt(s.maxEnergy)}`;

  $('#buff').innerHTML = ch.buffs.label ? `<div class="plate buff">⚡ ${esc(ch.buffs.label)} primed${ch.buffs.bonusDice ? ` · +${ch.buffs.bonusDice} dice` : ''}${ch.buffs.damageMult > 1 ? ` · ×${ch.buffs.damageMult} damage` : ''}</div>` : '';
  const D = S.defense?.[me];
  $('#defbox').innerHTML = D ? `<button class="btn danger defend" id="defend">⚔ Foes attack! Roll defense</button>` : '';
  if (D && D.id !== seenDefense) { seenDefense = D.id; if (!defenseOpen) setTimeout(defenseSheet, 50); }
  const atk = $('#atk');
  const left = strikeLeft(ch), st = ch.strike || {};
  atk.classList.toggle('hidden', left > 0);
  atk.disabled = ch.hp <= 0;
  const basePool = s.pool + (ch.hidden ? HIDDEN_DICE : 0);
  atk.innerHTML = ch.hp <= 0 ? 'Fallen — await healing' : `Attack · roll ${basePool}${ch.hidden ? ' from hiding' : ''} <span class="dice">${'<i class="die"></i>'.repeat(Math.min(basePool, 8))}</span>`;

  // foes
  const mine = engagedWith(S, me);
  const minions = mine.filter(f => f.type === 'minion');
  const all = Object.values(S.enemies);
  const bigs = all.filter(e => e.type !== 'minion').sort((x, y) => (y.target === me) - (x.target === me));
  const otherMinions = new Map();
  for (const e of all) if (e.type === 'minion' && e.target !== me) { const k = e.target || ''; otherMinions.set(k, [...(otherMinions.get(k) || []), e]); }
  const bigFoe = b => `<div class="plate bigfoe" data-spend="${b.id}" data-big="1" style="margin-top:10px">
      <div class="row"><div class="nm grow">${esc(b.name)}${b.pinned ? ' <span class="pinbadge">📌 Pinned</span>' : ''}</div><span class="faint" style="font-size:13px">${b.target === me ? 'on you' : b.target ? 'on ' + esc(S.characters[b.target]?.name || '?') : 'roaming'}</span></div>
      <div class="bar foe" style="margin-top:8px"><i style="width:${(b.hp / b.maxHp) * 100}%"></i><span>${fmt(b.hp)} / ${fmt(b.maxHp)}</span></div>
      <div class="faint" style="font-size:13px;margin-top:6px">⛨ ${b.armor || 0}% armor · ⚔ ${b.attacks || 1} attack${(b.attacks || 1) > 1 ? 's' : ''} × ${fmt(b.damage)}${b.ability ? `<br><span style="color:#ffcfa8">✦ ${esc(b.ability)}</span>` : ''}</div>
      ${(b.abilities || []).length ? `<div class="fabs">${b.abilities.map(k => { const A = FOE_ABILITIES[k], on = (b.fired || []).includes(k); return `<div class="fab ${on ? 'fired' : ''}"><b>${A.icon} ${esc(A.name)}${on ? ` · ${esc(A.tag || 'active')}` : ''}</b> <span>${esc(A.text)}</span></div>`; }).join('')}</div>` : ''}</div>`;
  $('#foes').className = left ? 'armed' : '';
  $('#foes').innerHTML = `
    ${left ? `<div class="plate pool"><div class="ph">⚔ ${left} hit${left === 1 ? '' : 's'} to spend</div>
      <div class="ps">${[st.hits && `${st.hits} normal`, st.crits && `${st.crits} crit${st.crits > 1 ? 's' : ''} ×${s.critMult}`, st.minion && `${st.minion} minion-only`, st.mult > 1 && `×${st.mult} damage`].filter(Boolean).join(' · ')}</div>
      <div class="ps" style="color:var(--ink)">Tap minions to slay · tap elites & bosses to strike</div>
      <div class="row" style="margin-top:10px"><button class="btn sm grow" data-spend="table">☠ Slay one on the table</button><button class="btn sm danger" id="endAtk">Done</button></div></div>` : ''}
    <div class="rule"><span class="gem"></span>${mine.length ? 'Foes upon you' : 'Foes'}<span class="gem"></span></div>
    ${minions.length ? `<div class="foes">${minions.map(m => `<button class="mtile ${m.pinned ? 'pinned' : ''}" data-spend="${m.id}" aria-label="${esc(m.name)}"><span class="minion">☠</span><span class="mname">${esc(m.name)}${m.pinned ? ' · 📌' : ''}</span></button>`).join('')}</div>` : ''}
    ${mine.length && !D && ch.hp > 0 ? `<button class="btn sm block" id="breakaway" style="margin-top:12px">↗ Break away from foes${ch.hidden ? ' (unseen: no free blows)' : ''}</button>` : ''}
    ${bigs.map(bigFoe).join('')}
    ${otherMinions.size ? `<div class="others">${[...otherMinions].map(([t, list]) => `<button class="ogrp" data-spend="${list[0].id}"><span class="minion">☠</span><span>${list.length > 1 ? `${list.length}× ` : ''}${esc(list[0].name)}${list.length > 1 && list.some(x => x.name !== list[0].name) ? ' & co' : ''}<br><small>${t ? 'on ' + esc(S.characters[t]?.name || '?') : 'roaming'}</small></span></button>`).join('')}</div>` : ''}
    ${!all.length ? `<p class="faint center" style="margin:0">No foes tracked. After rolling, use “Slay one on the table” for each minion you cut down.</p>` : ''}`;

  $('#powers').innerHTML = powersFor(ch).map(a => {
    const ready = ch.energy >= a.cost && ch.hp > 0;
    const tag = a.set ? `<div class="pset" style="color:${SETS[a.set].color}">✦ ${esc(SETS[a.set].name)} · ${a.pieces} piece${a.pieces > 1 ? 's' : ''}${a.boosted?.length ? ' · ⟡ ' + esc(a.boosted.join(', ')) : ''}</div>` : '';
    const tags = (a.tags || []).map(t => `<span class="ptag">${esc(t)}</span>`).join('');
    return `<button class="plate power ${ready ? 'ready' : ''}" data-power="${a.key}"><div class="row"><div class="grow">${tag}<div class="pn">${esc(a.name)}${tags}</div><div class="pt">${esc(a.text)}</div></div><div class="cost">${a.cost}</div></div><div class="bar en"><i style="width:${Math.min(100, ch.energy / a.cost * 100)}%"></i></div></button>`;
  }).join('');
  $('#sets').innerHTML = setsHTML(ch);
  // the rest of the party: health at a glance, for healing decisions
  const mates = S.order.filter(id => id !== me).map(id => S.characters[id]).filter(Boolean);
  $('#party').innerHTML = mates.length ? `<div class="rule"><span class="gem"></span>Party<span class="gem"></span></div>` + mates.map(c => {
    const m = derive(c).maxHp;
    return `<div class="mate${c.hp <= 0 ? ' down' : ''}" data-mate="${c.id}" role="button"><div class="row" style="gap:8px"><span class="mn grow">${heroIcon(c, CLASSES[c.cls]?.glyph || '', 26)} ${esc(c.name)}</span>${c.ward ? `<span class="mw">⛨ ${fmt(c.ward)}</span>` : ''}<span class="faint" style="font-size:12px">${(t => `${t.boss ? `♛${t.boss} ` : ""}${t.elite ? `⚔${t.elite} ` : ""}☠${t.minion}`)(tallyOf(c))} · ⚡${fmt(c.energy)}</span><span class="mgear">Gear ›</span></div><div class="bar hp"><i style="width:${Math.max(0, Math.min(100, c.hp / m * 100))}%"></i><span>${c.hp <= 0 ? 'DOWN' : `${fmt(c.hp)} / ${fmt(m)}`}</span></div></div>`;
  }).join('') : '';
  const open = $('#boardbox details')?.open;
  $('#boardbox').innerHTML = S.board?.tokens?.length ? `<details class="plate" style="margin-top:14px;padding:10px 12px" ${open ? 'open' : ''}><summary class="display" style="cursor:pointer;letter-spacing:.2em;font-size:14px;color:var(--brass)">🗺 Board map <span class="faint" style="font-size:12px;letter-spacing:.06em">· snapped ${new Date(S.board.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span></summary><div style="margin-top:8px">${boardMapSVG(S, { highlight: me })}</div></details>` : '';

  $('#gear').innerHTML = SLOTS.map(sl => {
    const it = ch.gear[sl];
    return `<button class="slot ${it ? 'filled r-' + it.rarity : ''}" ${it?.set ? `style="--rc:${SETS[it.set].color}"` : ''} data-slot="${sl}"><span class="sl">${SLOT_LABEL[sl]}</span><span class="sn">${it ? esc(it.name) : '—'}</span></button>`;
  }).join('') + `<div class="slot" style="border-style:dashed"><span class="sl">Satchel</span><span class="num" style="font-size:22px;color:var(--brass)">${ch.bag.length}</span></div>`;
  $('#bag').innerHTML = ch.bag.length ? ch.bag.map(it => `<button data-bag="${it.id}">${itemHTML(it)}</button>`).join('') : '';

  const rows = [['Move', `${s.move}″`], ['Reach', reachText(s.reach)], ['Health', fmt(s.maxHp)], ['Armor', `${s.armor}%`], ['Attack dice', s.dice], ['Damage / hit', fmt(s.damage)], ['Crit (on 6)', `×${s.critMult}`], ['Cleave', s.cleave], ['Energy / kill', s.energyPerKill], ['Energy / round', s.energyPerRound]];
  $('#stats').innerHTML = rows.map(([k, v]) => `<div><span class="dim">${k}</span><b>${v}</b></div>`).join('');
  drawMerchant(ch);
  drawCrown(ch);
  $('#log').innerHTML = S.log.slice(0, 8).map(l => `<div class="${l.kind}">${esc(l.text)}</div>`).join('');
}

// ---------------------------------------------------------- defense flow
const tallyLine = ch => { const t = tallyOf(ch); return [t.boss && `♛ ${t.boss} boss${t.boss > 1 ? 'es' : ''}`, t.elite && `⚔ ${t.elite} elite${t.elite > 1 ? 's' : ''}`, `☠ ${fmt(t.minion)} minion${t.minion === 1 ? '' : 's'}`].filter(Boolean).join(' · '); };
// A party member's gear, read-only: what they wear, what's in their satchel, and their sets.
function mateBody(id) {
  const ch = S.characters[id];
  if (!ch) return '<p class="dim">This hero is gone.</p>';
  const C = CLASSES[ch.cls], s = derive(ch), b = C.base;
  const stat = (label, val, base, f = v => v) => `<div><span class="dim">${label}</span><b class="${val > base ? 'up' : ''}">${f(val)}</b></div>`;
  return `<h2>${heroIcon(ch, C.glyph, 56)} ${esc(ch.name)}</h2>
    <div class="faint" style="font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:12px">${C.name} · ${tallyLine(ch)} · green = boosted by gear</div>
    <div class="gstats">
      ${stat('Health', s.maxHp, b.maxHp, fmt)}${stat('Armor', s.armor, b.armor, v => v + '%')}${stat('Dice', s.dice, b.dice)}${stat('Dmg / hit', s.damage, b.damage, fmt)}
      ${stat('Crit', s.critMult, b.critMult, v => '×' + v)}${stat('Cleave', s.cleave, b.cleave)}${stat('Energy / kill', s.energyPerKill, b.energyPerKill)}${stat('Energy / rnd', s.energyPerRound, b.energyPerRound)}
    </div>
    <div class="rule"><span class="gem"></span>Equipped<span class="gem"></span></div>
    ${SLOTS.some(sl => ch.gear[sl]) ? `<div class="ggrid">${SLOTS.filter(sl => ch.gear[sl]).map(sl => `<div>${itemHTML(ch.gear[sl])}</div>`).join('')}</div>` : ''}
    ${SLOTS.some(sl => !ch.gear[sl]) ? `<p class="faint" style="font-size:13px;margin:8px 0 0">Empty: ${SLOTS.filter(sl => !ch.gear[sl]).map(sl => SLOT_LABEL[sl]).join(', ')}</p>` : ''}
    <div class="rule"><span class="gem"></span>Sets<span class="gem"></span></div>
    ${setsHTML(ch)}
    <div class="rule"><span class="gem"></span>Satchel · ${ch.bag.length}<span class="gem"></span></div>
    ${ch.bag.length ? `<div class="ggrid">${ch.bag.map(it => `<div>${itemHTML(it)}</div>`).join('')}</div>` : '<p class="faint center">Empty.</p>'}`;
}
function mateSheet(id) { sheet(`<div>${mateBody(id)}</div>`); }

function defenseSheet() {
  const D = S.defense?.[me];
  if (!D || defenseOpen) return;
  defenseOpen = true;
  if (navigator.vibrate) navigator.vibrate([80, 50, 80]);
  const landed = D.groups.map(() => null);
  let highGround = false;
  const top = D.groups.reduce((m, g, i) => (g.damage > D.groups[m].damage ? i : m), 0);
  const range = D.landOn === 2 ? '1 or 2' : '1, 2 or 3';
  const { el, close } = sheet('<div id="ds"></div>', { onClose: () => { defenseOpen = false; } });
  const draw = () => {
    const raw = D.groups.reduce((t, g, i) => t + (landed[i] || 0) * g.damage, 0);
    const ready = landed.every(v => v !== null);
    const dice = i => D.groups[i].dice + (highGround && i === top ? 1 : 0);
    el.querySelector('#ds').innerHTML = `
      <h2 style="color:#ff9ca4">${D.breakaway ? 'Free blows!' : 'Foes attack!'}</h2>
      ${D.breakaway ? '<p class="dim" style="margin:2px 0">You break away: each foe you leave gets one free blow.</p>' : ''}
      ${D.surrounded ? '<p style="margin:4px 0;color:#ffb27d">⚠ Surrounded: +1 die against you.</p>' : ''}
      <button class="tog ${highGround ? 'on' : ''}" data-hg="1" style="margin-top:6px">▲ A foe strikes from higher ground <b>+1</b></button>
      <p class="dim" style="margin:4px 0 0;font-size:17px">Roll one die per attack. Every die showing <b style="color:var(--ink)">${range}</b> is a blow that lands.${D.landOn === 2 ? ' <span style="color:var(--brass)">Your heavy armor turns aside 3s.</span>' : ''}</p>
      ${D.groups.map((g, i) => `<div class="grp"><div class="row"><span class="gn grow">${g.count > 1 ? g.count + ' × ' : ''}${esc(g.name)}${g.type === 'minion' && g.count > 1 ? 's' : ''}</span><span class="faint" style="font-size:13px">${fmt(g.damage)} per blow</span></div>
        <div class="instr" style="margin:8px 0">Roll <b>${dice(i)}</b> ${dice(i) === 1 ? 'die' : 'dice'}. How many show ${range}?</div>
        <div class="pick">${Array.from({ length: dice(i) + 1 }, (_, n) => `<button class="${landed[i] === n ? 'on' : ''}" data-g="${i}" data-n="${n}">${n}</button>`).join('')}</div></div>`).join('')}
      ${ready ? `<div class="incoming">${raw ? `Incoming ${fmt(raw)} before armor` : 'Every blow turned aside!'}</div>` : ''}
      <div style="height:14px"></div>
      <button class="btn ${ready && !raw ? 'aether' : 'danger'} block attack" id="take" ${ready ? '' : 'disabled'}>${!ready ? 'Count your dice' : raw ? 'Take the blows' : 'Unscathed!'}</button>`;
  };
  draw();
  el.addEventListener('click', e => {
    if (e.target.closest('[data-hg]')) { highGround = !highGround; if (!highGround && landed[top] > D.groups[top].dice) landed[top] = D.groups[top].dice; return draw(); }
    const b = e.target.closest('[data-g]');
    if (b) { landed[Number(b.dataset.g)] = Number(b.dataset.n); return draw(); }
    if (e.target.closest('#take')) { close(); act({ type: 'defend', charId: me, landed, highGround }).catch(() => {}); }
  });
}

// ---------------------------------------------------------- attack flow
function attackSheet() {
  const ch = S.characters[me], s = derive(ch);
  if (ch.hp <= 0) return;
  let hits = null, sixes = 0, high = false, flank = false;
  const hiding = ch.hidden ? HIDDEN_DICE : 0;
  const { el, close } = sheet('<div id="as"></div>');
  const draw = () => {
    const pool = s.pool + hiding + (high ? 1 : 0) + (flank ? 1 : 0);
    if (hits > pool) hits = pool;
    el.querySelector('#as').innerHTML = `
      <h2>Attack</h2>
      <p class="dim" style="margin:2px 0 8px">${s.reach ? `Any foe within ${s.reach}″ that you can see.` : 'A foe next to you.'}</p>
      <div class="toggles">
        <button class="tog ${high ? 'on' : ''}" data-tog="high">▲ High ground <b>+1</b></button>
        <button class="tog ${flank ? 'on' : ''}" data-tog="flank">⇆ Flanking <b>+1</b></button>
        ${hiding ? `<span class="tog on fixed">◐ From hiding <b>+${hiding}</b></span>` : ''}
      </div>
      <div class="instr">Roll <b>${pool}</b> dice. How many show <b>4+</b>?</div>
      <div class="pick">${Array.from({ length: pool + 1 }, (_, i) => `<button class="${hits === i ? 'on' : ''}" data-h="${i}">${i}</button>`).join('')}</div>
      ${hits > 0 ? `<div class="instr">Of those, how many are <b>6</b>? <span class="faint" style="font-size:14px">crits strike elites & bosses for ×${s.critMult}${s.cleave ? ` · each also grants ${s.cleave} free minion kill` : ''}</span></div>
        <div class="pick">${Array.from({ length: hits + 1 }, (_, i) => `<button class="${sixes === i ? 'on' : ''}" data-s="${i}">${i}</button>`).join('')}</div>` : ''}
      <div style="height:16px"></div>
      <button class="btn solid block attack" id="strike" ${hits === null ? 'disabled' : ''}>${hits === null ? 'Count your dice' : hits === 0 ? 'A miss' : `Ready ${hits} hit${hits > 1 ? 's' : ''}`}</button>`;
  };
  draw();
  el.addEventListener('click', e => {
    const tg = e.target.closest('[data-tog]'); if (tg) { if (tg.dataset.tog === 'high') high = !high; else flank = !flank; return draw(); }
    const hb = e.target.closest('[data-h]'); if (hb) { hits = Number(hb.dataset.h); sixes = Math.min(sixes, hits); return draw(); }
    const sb = e.target.closest('[data-s]'); if (sb) { sixes = Number(sb.dataset.s); return draw(); }
    if (e.target.closest('#strike')) { close(); act({ type: 'attack', charId: me, hits, sixes, bonus: (high ? 1 : 0) + (flank ? 1 : 0) }).catch(() => {}); }
  });
}

function powerSheet(key) {
  const ch = S.characters[me];
  const a = powersFor(ch).find(x => x.key === key);
  if (!a) return;
  const T = a.target || null;
  const canSlam = a.effects.some(f => f.kind === 'push' || f.kind === 'pull');
  const counts = a.effects.some(f => f.kind === 'areaHit');
  const picked = new Map(); // enemyId -> 'hit' | 'slam'
  const allies = new Set();
  let table = 0;
  const { el, close } = sheet('<div id="ps"></div>');
  const tokens = () => {
    const all = Object.values(S.enemies);
    const groups = [['On you', all.filter(e => e.target === me)], ...S.order.filter(id => id !== me).map(id => [`On ${esc(S.characters[id].name)}`, all.filter(e => e.target === id)]), ['Roaming', all.filter(e => !e.target)]].filter(([, l]) => l.length);
    if (!groups.length) return '<p class="faint">No foes tracked in the app.</p>';
    return groups.map(([label, list]) => `<div class="tgrp"><div class="tl">${label}</div><div class="tlist">${list.map(e => {
      const st = picked.get(e.id) || '';
      return e.type === 'minion'
        ? `<button class="minion tsel ${st}" data-pick="${e.id}">${st === 'slam' ? '✸' : '☠'}</button>`
        : `<button class="bigsel ${st}" data-pick="${e.id}">${esc(e.name)}${st === 'slam' ? ' ✸ slammed' : ''}</button>`;
    }).join('')}</div></div>`).join('');
  };
  const draw = () => {
    const ok = ch.energy >= a.cost && ch.hp > 0;
    const max = T?.max || 99;
    const allyOk = !T?.allies || !T.exactly || allies.size === T.exactly;
    const nFoes = picked.size + table;
    el.querySelector('#ps').innerHTML = `<h2>${esc(a.name)}</h2><p class="dim" style="font-size:17px;margin:4px 0 10px">${esc(a.text)}</p>
      ${T?.foes ? `<div class="instr" style="font-size:16px">Tap every foe ${esc(T.foes)}${T.max ? ` (up to ${T.max})` : ''}.${canSlam ? ' <span style="color:#ffb27d">Tap again if it was slammed into a wall, a foe or off a ledge (+1 hit).</span>' : ''}</div>
        ${tokens()}
        ${counts ? `<div class="row" style="margin-top:8px;gap:8px"><span class="dim" style="font-size:14px">Untracked minions caught on the table:</span><button class="mini" data-table="-1">−</button><b class="num">${table}</b><button class="mini" data-table="1">+</button></div>` : ''}` : ''}
      ${T?.allies ? `<div class="instr" style="font-size:16px">Choose ${T.exactly === 1 ? 'the ally' : 'allies'} ${esc(T.allies)}:</div>
        <div class="row" style="flex-wrap:wrap;gap:8px">${S.order.filter(id => id !== me).map(id => `<button class="tog ${allies.has(id) ? 'on' : ''}" data-ally="${id}">${esc(S.characters[id].name)}</button>`).join('') || '<span class="faint">No allies in the game.</span>'}</div>` : ''}
      <p class="num" style="font-size:20px;margin:14px 0 8px;color:${ok ? 'var(--aether)' : 'var(--ink-faint)'}">Costs ${a.cost} energy · you have ${ch.energy}</p>
      <button class="btn aether block attack" id="use" ${ok && allyOk ? '' : 'disabled'}>${!ok ? 'Not enough energy' : !allyOk ? 'Choose an ally' : T?.foes && !nFoes && !T.optional ? 'Unleash (no foes caught)' : a.attack ? 'Unleash & attack' : 'Unleash'}</button>
      ${a.attack ? '<p class="faint center" style="font-size:13px;margin:6px 0 0">An attack power: the attack roll opens next, all as one action.</p>' : ''}`;
    el.dataset.max = max;
  };
  draw();
  el.addEventListener('click', e => {
    const pk = e.target.closest('[data-pick]');
    if (pk) {
      const id = pk.dataset.pick, cur = picked.get(id);
      if (!cur) { if (picked.size >= (T.max || 99)) return toast(`Up to ${T.max}`); picked.set(id, 'hit'); }
      else if (cur === 'hit' && canSlam) picked.set(id, 'slam');
      else picked.delete(id);
      return draw();
    }
    const tb = e.target.closest('[data-table]'); if (tb) { table = Math.max(0, table + Number(tb.dataset.table)); return draw(); }
    const al = e.target.closest('[data-ally]');
    if (al) { const id = al.dataset.ally; if (allies.has(id)) allies.delete(id); else { if (T.exactly === 1) allies.clear(); allies.add(id); } return draw(); }
    if (e.target.closest('#use')) {
      close();
      act({ type: 'ability', charId: me, key, targets: [...picked.keys()], slammed: [...picked].filter(([, v]) => v === 'slam').map(([k]) => k), allies: [...allies], tableKills: table })
        .then(() => { if (a.attack && !strikeLeft(S.characters[me])) setTimeout(attackSheet, 350); }).catch(() => {});
    }
  });
}

function breakawaySheet() {
  const ch = S.characters[me];
  const mine = engagedWith(S, me);
  const leaving = new Set(mine.map(e => e.id));
  const { el, close } = sheet('<div id="bs"></div>');
  const draw = () => {
    el.querySelector('#bs').innerHTML = `<h2>Break away</h2>
      <p class="dim" style="font-size:17px">${ch.hidden ? 'You are Hidden: you slip away without free blows.' : 'Each foe you step away from gets one free blow (1 die each). Leaps, teleports and swaps avoid this.'} Tap to choose which foes you're leaving.</p>
      <div class="tlist">${mine.map(e => e.type === 'minion'
        ? `<button class="minion tsel ${leaving.has(e.id) ? 'hit' : ''}" data-leave="${e.id}">☠</button>`
        : `<button class="bigsel ${leaving.has(e.id) ? 'hit' : ''}" data-leave="${e.id}">${esc(e.name)}</button>`).join('')}</div>
      <div style="height:14px"></div>
      <button class="btn danger block attack" id="go" ${leaving.size ? '' : 'disabled'}>${ch.hidden ? 'Slip away' : `Break away: ${leaving.size} free blow${leaving.size === 1 ? '' : 's'}`}</button>`;
  };
  draw();
  el.addEventListener('click', e => {
    const l = e.target.closest('[data-leave]');
    if (l) { const id = l.dataset.leave; leaving.has(id) ? leaving.delete(id) : leaving.add(id); return draw(); }
    if (e.target.closest('#go')) { close(); act({ type: 'disengage', charId: me, enemyIds: [...leaving] }).catch(() => {}); }
  });
}

function compare(it) {
  const ch = S.characters[me];
  const cur = ch.gear[it.slot];
  if (!cur) return `<p class="dim">Your ${SLOT_LABEL[it.slot].toLowerCase()} slot is empty.</p>`;
  return `<p class="faint" style="margin:14px 0 6px">Currently equipped:</p>${itemHTML(cur)}`;
}

function giveHTML() {
  const others = S.order.filter(id => id !== me).map(id => S.characters[id]);
  if (!others.length) return '';
  return `<p class="dim" style="margin:18px 0 8px">Give to a companion:</p><div class="row" style="flex-wrap:wrap">${others.map(c => `<button class="btn sm" data-give="${c.id}">${esc(c.name)}</button>`).join('')}</div>`;
}
function wireGive(el, it, close) {
  el.addEventListener('click', e => {
    const g = e.target.closest('[data-give]');
    if (!g) return;
    const to = S.characters[g.dataset.give];
    if (!confirm(`Give ${it.name} to ${to.name}?`)) return;
    close();
    act({ type: 'giveItem', charId: me, itemId: it.id, to: to.id }).then(() => toast(`${it.name} sent to ${to.name}`)).catch(() => {});
  });
}

function bagSheet(id) {
  const it = S.characters[me].bag.find(x => x.id === id);
  if (!it) return;
  const { el, close } = sheet(`${itemHTML(it)}${compare(it)}<div class="row" style="margin-top:16px"><button class="btn solid grow" id="eq">Equip</button><button class="btn danger" id="dc">Discard</button></div>${giveHTML()}`);
  wireGive(el, it, close);
  el.querySelector('#eq').onclick = () => { close(); act({ type: 'equip', charId: me, itemId: id }).catch(() => {}); };
  el.querySelector('#dc').onclick = () => { if (confirm(`Discard ${it.name}?`)) { close(); act({ type: 'discard', charId: me, itemId: id }).catch(() => {}); } };
}

function slotSheet(slot) {
  const it = S.characters[me].gear[slot];
  if (!it) return toast(`No ${SLOT_LABEL[slot].toLowerCase()} yet — find some loot!`);
  const { el, close } = sheet(`${itemHTML(it)}<div style="height:14px"></div><button class="btn block" id="un">Move to satchel</button>${giveHTML()}`);
  wireGive(el, it, close);
  el.querySelector('#un').onclick = () => { close(); act({ type: 'unequip', charId: me, slot }).catch(() => {}); };
}

function reveal(it, from) {
  const r = h(`<div class="reveal r-${it.rarity}" ${it.set ? `style="--rc:${SETS[it.set].color}"` : ''}><div class="sunburst"></div><div class="hdr">${from ? `Gift from ${esc(from)}!` : it.set ? `${esc(SETS[it.set].name)} set piece!` : `${RARITIES[it.rarity].label} find!`}</div><div class="card">${itemHTML(it)}</div><div class="card" style="animation-delay:.1s">${compare(it)}</div><div class="acts"><button class="btn solid grow" id="eq">Equip now</button><button class="btn grow" id="keep">To satchel</button></div></div>`);
  document.body.appendChild(r);
  if (navigator.vibrate) navigator.vibrate([40, 60, 120]);
  r.querySelector('#eq').onclick = () => { r.remove(); act({ type: 'equip', charId: me, itemId: it.id }).catch(() => {}); };
  r.querySelector('#keep').onclick = () => r.remove();
}

const RANK = { common: 0, magic: 1, rare: 2, legendary: 3, set: 4 };
function revealCache(items, label, kind) {
  const best = [...items].sort((a, b) => RANK[b.rarity] - RANK[a.rarity])[0];
  const color = best.set ? SETS[best.set].color : null;
  const title = kind === 'boss' ? `${esc(label)} falls!` : kind === 'elite' ? `${esc(label)} drops loot!` : `${esc(label || 'Treasure')} opened!`;
  const r = h(`<div class="reveal cache r-${best.rarity}" ${color ? `style="--rc:${color}"` : ''}><div class="sunburst"></div>
    <div class="hdr">${title}</div>
    <div class="cachelist">${items.map((it, i) => `<div class="card" style="animation-delay:${i * 0.12}s">${itemHTML(it, `<div class="iacts"><button class="btn sm solid" data-eqi="${it.id}">Equip</button></div>`)}</div>`).join('')}</div>
    <p class="dim center" style="position:relative;margin:10px 0 0">${items.length} treasures in your satchel. Compare with your party and trade!</p>
    <div class="acts"><button class="btn solid grow" id="done">Done</button></div></div>`);
  document.body.appendChild(r);
  if (navigator.vibrate) navigator.vibrate([40, 60, 40, 60, 160]);
  r.addEventListener('click', e => {
    const b = e.target.closest('[data-eqi]');
    if (b) { b.disabled = true; b.textContent = 'Equipped ✓'; act({ type: 'equip', charId: me, itemId: b.dataset.eqi }).catch(() => { b.disabled = false; b.textContent = 'Equip'; }); }
    if (e.target.closest('#done')) r.remove();
  });
}

// ---------------------------------------------------------- the Rakshasa
const RAK = 'portraits/rakshasa.jpg';
function rakSay(title, line, sub = '', art = '') {
  sheet(`<div class="rak">${art || `<img class="rakpic" src="${RAK}" alt="">`}<h2 class="center">${esc(title)}</h2>${line ? `<p class="narr center">“${esc(line)}”</p>` : ''}${sub ? `<p class="faint center">${esc(sub)}</p>` : ''}</div>`);
}
let stallOpen = null;
function drawMerchant(ch) {
  const open = !!S.merchant?.open;
  $('#stallbtn').innerHTML = open ? `<button class="btn solid block stallbtn" id="openStall"><img class="rakpic sm" src="${RAK}" alt=""> Visit the Rakshasa's stall <span class="fav">⟡ ${ch.favour || 0}</span></button>` : '';
  const ws = ch.consumables || [];
  $('#wares').innerHTML = ws.length || ch.favour ? `<div class="wares"><span class="wl">Wares${ch.favour ? ` · <b>⟡ ${ch.favour}</b> Favour` : ''}</span>${ws.map(w => `<button class="ware" data-ware="${w.id}" title="${esc(CONSUMABLES[w.key]?.name || '')}">${consumableSVG(w.key, 44)}</button>`).join('')}</div>` : '';
  if (stallOpen) { if (!open) { stallOpen.close(); stallOpen = null; } else stallOpen.el.querySelector('#stall').innerHTML = stallBody(ch); }
}
function stallBody(ch) {
  const fav = ch.favour || 0;
  const boons = Object.entries(BOONS).map(([k, B]) => {
    const price = boonPrice(ch, k), lock = boonLocked(ch, k), have = (ch.boonBuys || {})[k] || 0;
    return `<div class="srow"><div class="grow"><b>${esc(B.name)}</b>${have ? ` <span class="faint">×${have}</span>` : ''}<div class="faint">${esc(B.text)}${B.once ? ' · once only' : ''}</div></div>
      <button class="btn sm ${!lock && fav >= price ? 'solid' : ''}" data-buyboon="${k}" ${lock || fav < price ? 'disabled' : ''}>${lock ? 'Owned' : `⟡ ${price}`}</button></div>`;
  }).join('');
  const wares = Object.entries(CONSUMABLES).map(([k, K]) => `<div class="srow">${consumableSVG(k, 40)}<div class="grow"><b>${esc(K.name)}</b><div class="faint">${esc(K.text)}</div></div>
      <button class="btn sm ${fav >= K.cost ? 'solid' : ''}" data-buyware="${k}" ${fav < K.cost ? 'disabled' : ''}>⟡ ${K.cost}</button></div>`).join('');
  const bag = ch.bag.length ? ch.bag.map(it => `<div class="srow"><div class="grow">${itemHTML(it)}</div><button class="btn sm" data-sell="${it.id}">Sell · ⟡ ${SELL_VALUE[it.rarity] || 1}</button></div>`).join('')
    : '<p class="faint center">Your satchel is empty. (He only buys what you carry, not what you wear.)</p>';
  return `<div class="rak"><img class="rakpic" src="${RAK}" alt=""><h2 class="center">The Rakshasa's Stall</h2><p class="narr center">“${esc(S.merchant?.line || '')}”</p>
    <div class="favbig">⟡ ${fav} <small>Favour</small></div></div>
    <div class="rule"><span class="gem"></span>Sell from your satchel<span class="gem"></span></div>${bag}
    <div class="rule"><span class="gem"></span>Boons · permanent<span class="gem"></span></div><p class="faint" style="margin:0 0 6px;font-size:13px">Each one costs ⟡1 more every time you buy it again.</p>${boons}
    <div class="rule"><span class="gem"></span>Wares · single use<span class="gem"></span></div>${wares}`;
}
function stallSheet() {
  const ch = S.characters[me];
  stallOpen = sheet(`<div id="stall">${stallBody(ch)}</div>`, { onClose: () => { stallOpen = null; } });
  stallOpen.el.addEventListener('click', e => {
    const sl = e.target.closest('[data-sell]');
    if (sl) { const it = S.characters[me].bag.find(x => x.id === sl.dataset.sell); if (it && confirm(`Sell ${it.name} for ⟡ ${SELL_VALUE[it.rarity] || 1}? This can't be undone.`)) act({ type: 'sell', charId: me, itemId: it.id }).catch(() => {}); return; }
    const bb = e.target.closest('[data-buyboon]');
    if (bb) return act({ type: 'buyBoon', charId: me, key: bb.dataset.buyboon }).catch(() => {});
    const bw = e.target.closest('[data-buyware]');
    if (bw) return act({ type: 'buyConsumable', charId: me, key: bw.dataset.buyware }).catch(() => {});
  });
}
function wareSheet(id) {
  const ch = S.characters[me], w = (ch.consumables || []).find(x => x.id === id);
  if (!w) return;
  const K = CONSUMABLES[w.key];
  const used = ch.usedConsumable === S.round;
  const { el, close } = sheet(`<div class="rak">${consumableSVG(w.key, 96)}<h2 class="center">${esc(K.name)}</h2><p class="center" style="font-size:18px">${esc(K.text)}</p>
    <p class="faint center" style="font-size:13px">Free to use on your turn (not your action). One per turn.</p>
    <button class="btn aether block attack" id="useWare" ${used ? 'disabled' : ''}>${used ? 'Already used one this turn' : 'Use it now'}</button></div>`);
  el.querySelector('#useWare').onclick = () => { close(); act({ type: 'useConsumable', charId: me, id }).catch(() => {}); };
}

// ---------------------------------------------------------- Three-Card Crown
let crownPick = new Set(), crownWager = null, crownSeen = localStorage.getItem('dl.crownSeen') || '';
function drawCrown(ch) {
  const g = S.crown, p = g?.players?.[me];
  let box = $('#crownTable');
  if (!g || !p || (g.phase === 'done' && crownSeen === g.id)) { if (box) box.remove(); return; }
  if (!box) { box = h('<div class="reveal crown" id="crownTable"><div class="sunburst"></div><div class="ct" id="ct"></div></div>'); document.body.appendChild(box); crownPick = new Set(); crownWager = null; box.addEventListener('click', crownClick); }
  if (box.dataset.g !== g.id) { box.dataset.g = g.id; crownPick = new Set(); crownWager = null; }
  const fav = ch.favour || 0, maxW = Math.min(3, fav);
  if (crownWager === null) crownWager = Math.min(1, maxW);
  const done = g.phase === 'done';
  const stakes = g.prize ? `<div class="stake">Prize: ${consumableSVG(g.prize, 30)} <b>${esc(CONSUMABLES[g.prize].name)}</b></div>`
    : `<div class="stake">Wager <span class="wpick">${Array.from({ length: maxW + 1 }, (_, i) => `<button class="${crownWager === i ? 'on' : ''}" data-wager="${i}" ${p.done ? 'disabled' : ''}>${i}</button>`).join('')}</span> Favour <span class="faint">(you have ⟡ ${fav})</span></div>`;
  const house = done ? g.house.map(c => cardSVG(c, { width: 64, cls: 'flip' })).join('') : g.house.map(() => cardBackSVG({ width: 64 })).join('');
  const mine = p.cards.map((c, i) => `<button class="cslot ${!p.done && crownPick.has(i) ? 'pick' : ''}" data-card="${i}" ${p.done ? 'disabled' : ''}>${cardSVG(c, { width: 88 })}${!p.done && crownPick.has(i) ? '<span class="swaptag">swap</span>' : ''}</button>`).join('');
  const others = Object.entries(g.players).filter(([id]) => id !== me).map(([id, q]) => {
    const n = esc(S.characters[id]?.name || '?');
    return done ? `<div class="orow ${q.win ? 'win' : 'lose'}">${n}: ${esc(q.hand)} — ${q.win ? (g.prize ? 'wins!' : q.wager ? `+${q.wager} ⟡` : 'wins (no wager)') : (g.prize ? 'loses' : q.wager ? `−${q.wager} ⟡` : 'loses (no wager)')}</div>` : `<div class="orow">${n}: ${q.done ? 'ready' : 'thinking…'}</div>`;
  }).join('');
  const myHand = handName(scoreHand(p.cards));
  $('#ct').innerHTML = `<div class="hdr">Three-Card Crown</div>
    <div class="rakline"><img class="rakpic sm" src="${RAK}" alt=""> “${esc(done ? g.result : g.line)}”</div>
    <div class="lbl2">The Rakshasa${done ? ` · <b>${esc(g.houseHand)}</b>` : ''}</div><div class="hand house">${house}</div>
    <div class="lbl2">Your hand · <b>${esc(myHand)}</b></div><div class="hand">${mine}</div>
    ${done ? `<div class="verdict ${p.win ? 'win' : 'lose'}">${p.win ? (g.prize ? `You win the ${esc(CONSUMABLES[g.prize].name)}!` : p.wager ? `You win ⟡ ${p.wager}!` : 'You win! (no wager)') : (g.prize ? 'The house wins.' : p.wager ? `You lose ⟡ ${p.wager}.` : 'The house wins. (no wager)')}</div>`
      : p.done ? '<div class="verdict">Waiting for the others…</div>'
      : `${stakes}<p class="faint center" style="margin:6px 0">Tap up to 2 cards to swap, once. Ties go to the house.</p>
        <button class="btn solid block attack" id="crownGo">${crownPick.size ? `Swap ${crownPick.size} and reveal` : 'Stand'}</button>`}
    ${others ? `<div class="others2">${others}</div>` : ''}
    <details class="ranks"><summary>Hand ranks</summary>Three of a kind › Run (4-5-6) › Flush (one suit) › Pair › High card. Rakshasa cards are wild.</details>
    ${done ? '<button class="btn block" id="crownLeave" style="margin-top:10px">Leave the table</button>' : ''}`;
}
function crownClick(e) {
  const c = e.target.closest('[data-card]');
  if (c && !c.disabled) { const i = Number(c.dataset.card); if (crownPick.has(i)) crownPick.delete(i); else if (crownPick.size < 2) crownPick.add(i); else toast('Up to 2 cards'); return drawCrown(S.characters[me]); }
  const w = e.target.closest('[data-wager]');
  if (w && !w.disabled) { crownWager = Number(w.dataset.wager); return drawCrown(S.characters[me]); }
  if (e.target.closest('#crownGo')) return act({ type: 'crownPlay', charId: me, swap: [...crownPick], wager: crownWager || 0 }).catch(() => {});
  if (e.target.closest('#crownLeave')) { crownSeen = S.crown?.id || ''; localStorage.setItem('dl.crownSeen', crownSeen); $('#crownTable')?.remove(); }
}

// Unlocks can arrive together (a set power and a synergy from one piece): show them one at a time,
// synergies last, and hold the button briefly so a quick double-tap can't skip one.
const unlockQueue = [];
let unlockShowing = false;
function revealUnlock(e) {
  unlockQueue.push(e);
  unlockQueue.sort((a, b) => (a.kind === 'synergy') - (b.kind === 'synergy'));
  if (!unlockShowing) { unlockShowing = true; setTimeout(nextUnlock, 60); }
}
function nextUnlock() {
  const e = unlockQueue.shift();
  if (!e) { unlockShowing = false; return; }
  unlockShowing = true;
  const syn = e.kind === 'synergy';
  const color = syn ? '#e7d9ff' : SETS[e.set]?.color || 'var(--brass)';
  const hdr = syn ? '⟡ Hidden synergy discovered ⟡' : e.kind === 'power' ? 'New power unlocked!' : 'Set grows stronger!';
  const r = h(`<div class="reveal unlock ${syn ? 'syn' : ''}" style="--rc:${color}"><div class="sunburst"></div><div class="hdr">${hdr}</div>
    <div class="card"><div class="plate" style="padding:18px;text-align:center">${syn ? '<div class="synsub">Your sets resonate</div>' : ''}<div class="carved" style="font-size:${syn ? 34 : 28}px;color:${color}">${syn ? '⟡' : '✦'} ${esc(e.name)}</div><p style="font-size:17px;margin:10px 0 0">${esc(e.text)}</p></div></div>
    <div class="acts"><button class="btn solid grow" id="ok" disabled>${syn ? 'Behold' : 'Excellent'}</button></div></div>`);
  document.body.appendChild(r);
  if (navigator.vibrate) navigator.vibrate(syn ? [80, 50, 80, 50, 80, 50, 400] : [60, 40, 60, 40, 200]);
  const ok = r.querySelector('#ok');
  setTimeout(() => { ok.disabled = false; }, syn ? 1400 : 700);
  ok.onclick = () => { r.remove(); setTimeout(nextUnlock, 250); };
}
</script>
</body>
</html>
