<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0c0a">
<title>Delvers' Ledger · Headquarters</title>
<link rel="stylesheet" href="app.css">
<style>
  body { font-size: 15px; }
  .bar-top { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 16px;
    background: linear-gradient(180deg, #16130d, #0d0c0a); border-bottom: 1px solid var(--brass-lo); box-shadow: 0 1px 0 #000, 0 3px 0 -1px var(--brass-lo); }
  .brand { font-family: var(--display); font-weight: 900; letter-spacing: .14em; text-transform: uppercase; font-size: 22px; background: var(--brass-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .roomcode { font-family: var(--display); font-weight: 900; font-size: 26px; letter-spacing: .3em; color: var(--ink); padding: 0 4px; }
  .rnd { font-family: var(--display); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
  .rnd b { color: var(--brass-hi); font-size: 26px; vertical-align: -3px; margin-left: 4px; }
  .layout { display: grid; grid-template-columns: 1fr 360px; gap: 18px; padding: 16px; align-items: start; }
  @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }
  .heroes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 14px; }
  @media (max-width: 400px) { .heroes { grid-template-columns: 1fr; } }
  .hc { padding: 14px; }
  .hc.down { --plate-bg: #1f0d10; }
  .hc .nm { font-family: var(--carved); font-weight: 800; font-size: 20px; color: var(--brass-hi); line-height: 1.1; }
  .hc .sub { font-family: var(--display); letter-spacing: .14em; text-transform: uppercase; font-size: 12px; color: var(--ink-dim); }
  .hc .bars { display: grid; gap: 5px; margin: 10px 0 8px; }
  .icon { width: 34px; height: 34px; border: 1px solid var(--line); background: var(--basalt); display: grid; place-items: center; color: var(--ink-dim); text-decoration: none; font-size: 16px; }
  .icon:hover { border-color: var(--brass); color: var(--brass-hi); }
  .ctl { display: flex; gap: 6px; align-items: flex-start; margin-top: 7px; }
  .ctl .btns { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .ctl .k { padding-top: 9px; }
  .ctl .k { width: 58px; font-family: var(--display); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 11px; color: var(--ink-faint); }
  .mini { min-width: 44px; height: 32px; padding: 0 8px; border: 1px solid var(--line); background: var(--obsidian); font-family: var(--display); font-weight: 800; font-size: 14px; letter-spacing: .04em;
    clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px); }
  .mini:hover { border-color: var(--brass); }
  .mini.hurt { color: #ff9ca4; } .mini.heal { color: #a8f0a0; } .mini.en { color: var(--aether); } .mini.foe { color: #ffb27d; }
  .mini.r { color: var(--rc); border-color: color-mix(in srgb, var(--rc) 45%, var(--line)); }
  .numin { width: 74px; height: 32px; padding: 0 8px; background: var(--obsidian); border: 1px solid var(--line); font-family: var(--display); font-weight: 800; font-size: 15px; }
  .foechips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .fchip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 9px; border: 1px solid #6e3818; background: #1f130b; color: #ffcfa8; font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: .04em; }
  .fchip button { border: 0; background: #3b1f10; color: #ffcfa8; width: 24px; height: 24px; }
  .side { display: grid; gap: 14px; }
  .side h3 { margin: 0 0 8px; font-family: var(--display); font-weight: 800; letter-spacing: .2em; text-transform: uppercase; font-size: 14px; color: var(--brass); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid2 label.lbl { margin-top: 2px; }
  .field.sm { min-height: 36px; padding: 6px 8px; font-size: 15px; }
  .foe-row { padding: 8px 0; border-bottom: 1px solid #2a2519; }
  .foe-row .nm { font-family: var(--carved); font-weight: 800; color: #ffb27d; }
  .log { font-size: 13px; color: var(--ink-dim); max-height: 360px; overflow: auto; }
  .log div { padding: 4px 0; border-bottom: 1px solid #221e15; }
  .log .kill { color: #ffcfa8; } .log .loot { color: var(--r-rare); } .log .hurt { color: #ff9ca4; } .log .ability { color: #aef7ee; } .log .round { color: var(--brass); }
  .empty { padding: 40px 20px; text-align: center; }
  .qrbox { background: #f3ead2; padding: 14px; width: min(320px, 80vw); margin: 10px auto; }
  .qrbox svg { display: block; width: 100%; height: auto; }
  .gate { max-width: 420px; margin: 18vh auto; padding: 20px; }
  .abchips { display: flex; flex-wrap: wrap; gap: 5px; }
  .abchip { padding: 4px 8px; border: 1px solid #5a3a22; background: var(--obsidian); color: #c9a58a; font-size: 13px; font-weight: 600; }
  .abchip.on { background: #6e3818; border-color: #e98f53; color: #ffe2cc; }
  .abtag { display: inline-block; margin: 2px 4px 0 0; padding: 1px 6px; border: 1px solid #6e3818; color: #ffcfa8; font-size: 12px; }
  .abtag.fired { background: #8a2b1a; border-color: #ff8a3d; color: #fff; }
  .foeabs summary { cursor: pointer; list-style: none; margin-top: 4px; }
  .foeabs summary::-webkit-details-marker { display: none; }
  .gearline { display: flex; gap: 8px; align-items: baseline; width: 100%; margin-top: 10px; padding: 8px 10px; border: 1px solid var(--line); background: var(--obsidian); text-align: left; font-size: 13px; line-height: 1.4;
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }
  .gearline:hover { border-color: var(--brass); }
  .gearline .k { font-family: var(--display); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 11px; color: var(--ink-faint); }
  .scrim .sheet.wide { max-width: 860px; }
  .tally { width: 100%; border-collapse: collapse; font-size: 15px; }
  .tally th { font-size: 16px; color: var(--brass); text-align: center; padding: 2px 6px; }
  .tally td { padding: 4px 6px; border-bottom: 1px solid #2a2519; text-align: center; font-family: var(--display); font-weight: 800; }
  .tally td:first-child { text-align: left; font-family: inherit; font-weight: 600; }
  .gstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 16px; font-size: 14px; margin: 10px 0 4px; }
  .gstats div { display: flex; justify-content: space-between; border-bottom: 1px solid #2a2519; padding: 4px 0; }
  .gstats b { font-family: var(--display); font-weight: 800; font-size: 16px; }
  .gstats .up { color: var(--ok); }
  .ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; align-items: start; }
  .ggrid .empty-slot { border: 1px dashed var(--line); padding: 12px; color: var(--ink-faint); font-family: var(--display); letter-spacing: .14em; text-transform: uppercase; font-size: 12px; display: flex; align-items: center; justify-content: center; min-height: 70px; }
  .iacts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  @media (max-width: 640px) { .gstats { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { CLASSES, ENEMY_TYPES, FOE_ABILITIES, reachText, SLOTS, SLOT_LABEL, SCALE_DEFAULT_ROUNDS, partyDamagePerRound, scaledHealth, derive, engagedWith, strikeLeft, fmt, RARITY_ORDER, RARITIES, tallyOf } from './engine.js';
import { $, h, esc, params, connect, toast, sheet, qrSVG, itemHTML, setsHTML, heroIcon } from './ui.js';

const room = (params.get('room') || '').toUpperCase();
if (!room) location.href = './';
localStorage.setItem('dl.lastRoom', room);
let pin = localStorage.getItem('dl.pin') || '';
let S = null, online = false, net = null;
const spawnCfg = { etype: 'minion', count: 3, target: '', name: '', hp: '', armor: '', attacks: '', damage: '', ability: '', scale: true, rounds: '', abilities: [] };

function gate(msg) {
  $('#root').innerHTML = `<div class="plate gate"><h2 class="carved" style="color:var(--brass-hi);margin:0">Game ${esc(room)}</h2><p class="dim">${esc(msg || 'Enter your GM PIN')}</p>
    <input class="field" id="pin" type="password" inputmode="numeric"><div style="height:12px"></div><button class="btn solid block" id="go">Open headquarters</button></div>`;
  const go = () => { pin = $('#pin').value; localStorage.setItem('dl.pin', pin); location.reload(); };
  $('#go').onclick = go; $('#pin').onkeydown = e => e.key === 'Enter' && go(); $('#pin').focus();
}
if (!pin) gate(); else start();

function start() {
  net = connect({
    room, role: 'gm', pin,
    onState: st => { S = st; render(); },
    onEvents: evs => evs.forEach(e => {
      const n = S.characters[e.charId]?.name;
      if (e.type === 'loot' && n) toast(`${n} ← ${e.item.name}`);
      if (e.type === 'ability' && n) toast(`${n}: ${e.name}`);
      if (e.type === 'cache' && n) toast(`${n} opened ${e.label}`);
      if (e.type === 'foeAbility') toast(`${FOE_ABILITIES[e.key].icon} ${e.enemyName}: ${e.name}`);
      if (e.type === 'unlock' && n) toast(`${n}: ${e.kind === 'synergy' ? 'synergy ' : ''}${e.name}!`);
    }),
    onStatus: on => { online = on; $('.conn')?.classList.toggle('on', on); },
    onFatal: msg => { localStorage.removeItem('dl.pin'); gate(msg); },
  });
}
const act = a => net.act(a).catch(() => {});

// keep typed values & focus across re-renders
function preserve(fn) {
  const vals = {}; document.querySelectorAll('[data-keep]').forEach(i => vals[i.dataset.keep] = i.value);
  const f = document.activeElement?.dataset?.keep;
  fn();
  document.querySelectorAll('[data-keep]').forEach(i => { if (vals[i.dataset.keep] != null) i.value = vals[i.dataset.keep]; });
  if (f) document.querySelector(`[data-keep="${f}"]`)?.focus();
}

function render() {
  preserve(() => {
    if (!$('#main')) shell();
    $('#rndv').textContent = S.round;
    $('#heroes').innerHTML = S.order.length ? S.order.map(id => heroCard(S.characters[id])).join('') :
      `<div class="plate dim empty"><div class="carved" style="font-size:22px;color:var(--brass-hi)">No heroes yet</div><p class="dim">Show the join code to your players. Each forges a hero on their phone.</p><button class="btn solid" data-a="qr">Show join code</button></div>`;
    $('#spawn').innerHTML = spawnPanel();
    scalePreview();
    const openAbs = new Set([...document.querySelectorAll('.foeabs[open]')].map(d => d.dataset.e));
    $('#roam').innerHTML = roamPanel();
    document.querySelectorAll('.foeabs').forEach(d => { if (openAbs.has(d.dataset.e)) d.open = true; });
    if (gearOpen) gearOpen.el.querySelector('#gearbody').innerHTML = gearBody(gearOpen.id);
    $('#tally').innerHTML = tallyPanel();
    $('#rak').innerHTML = rakPanel();
    $('#log').innerHTML = S.log.slice(0, 60).map(l => `<div class="${l.kind}">${esc(l.text)}</div>`).join('');
  });
}

function shell() {
  $('#root').innerHTML = `
    <div class="bar-top">
      <span class="brand">Headquarters</span>
      <span class="roomcode" title="Game code">${room}</span>
      <div class="conn ${online ? 'on' : ''}"></div>
      <button class="btn sm" data-a="qr">Join QR</button>
      <span class="grow"></span>
      <span class="rnd">Round<b id="rndv"></b></span>
      <button class="btn danger" data-a="enemyPhase" title="Every hero with foes on them rolls defense">Enemy phase ⚔</button>
      <button class="btn solid" data-a="endRound">End round ⟳</button>
      <button class="btn sm" data-a="undo">↶ Undo</button>
      <a class="btn sm" href="cards.html?room=${room}" target="_blank" style="text-decoration:none">Loot &amp; campaign</a>
      <a class="btn sm" href="board.html?room=${room}" target="_blank" style="text-decoration:none">📷 Board</a>
      <a class="btn sm" href="rules.html" target="_blank" style="text-decoration:none">Rules</a>
      <button class="btn sm" data-a="save" title="Download the whole game as a backup file">💾 Save</button>
      <button class="btn sm" data-a="restore" title="Load a backup file into this room">⟲ Restore</button>
      <input type="file" id="restoreFile" accept=".json,application/json" style="display:none">
      <button class="btn sm danger" data-a="reset">Reset</button>
    </div>
    <div class="layout" id="main">
      <div class="heroes" id="heroes"></div>
      <div class="side">
        <div class="plate"><h3>Summon foes</h3><div id="spawn"></div></div>
        <div class="plate dim"><h3>The Rakshasa</h3><div id="rak"></div></div>
        <div class="plate dim"><h3>Foes on the board</h3><div id="roam"></div></div>
        <div class="plate dim"><h3>Killing blows</h3><div id="tally"></div></div>
        <div class="plate dim"><h3>Chronicle</h3><div class="log" id="log"></div></div>
      </div>
    </div>`;
  document.body.addEventListener('click', onClick);
  document.body.addEventListener('change', onChange);
  document.body.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.dataset.keep?.startsWith('dmg-')) { const id = e.target.dataset.keep.slice(4); hitCustom(id); }
  });
}

// Leaderboard: killing blows by foe type (bosses first, then elites, then minions).
const tallyText = ch => { const t = tallyOf(ch); return `${t.boss ? `♛${t.boss} ` : ''}${t.elite ? `⚔${t.elite} ` : ''}☠${t.minion} slain`; };
// The Rakshasa's stall and Three-Card Crown: only the buttons that make sense right now.
function rakPanel() {
  if (!S.merchant?.open) return `<button class="btn solid block" data-a="rakOpen" title="Opens his stall on every phone: sell gear, buy boons and wares">🪔 Rakshasa appears</button>`;
  const g = S.crown;
  let cards = '';
  if (!g) cards = `<button class="btn block" data-a="crownDeal" title="Deal Three-Card Crown to every hero">🃏 Deal Three-Card Crown</button>`;
  else if (g.phase === 'play') {
    const ps = Object.values(g.players), done = ps.filter(p => p.done).length;
    cards = `<div class="faint" style="margin:4px 0">🃏 ${done} of ${ps.length} have played</div><button class="btn block" data-a="crownReveal" title="Reveal now, even if someone hasn't played">Reveal hands</button>`;
  } else cards = `<div class="faint" style="margin:4px 0">🃏 House had ${esc(g.houseHand || '')}</div><button class="btn block" data-a="crownEnd">Clear the table</button>`;
  return `<div class="faint" style="margin-bottom:6px">His stall is open on every phone.</div>${cards}<div style="height:6px"></div><button class="btn sm block" data-a="rakClose">Rakshasa leaves</button>`;
}

function tallyPanel() {
  const rows = S.order.map(id => S.characters[id]).map(c => ({ c, t: tallyOf(c) }))
    .sort((x, y) => y.t.boss - x.t.boss || y.t.elite - x.t.elite || y.t.minion - x.t.minion);
  if (!rows.length) return '<p class="faint">No heroes yet.</p>';
  return `<table class="tally"><tr><th></th><th title="Bosses">♛</th><th title="Elites">⚔</th><th title="Minions">☠</th></tr>${rows.map(({ c, t }, i) => `<tr><td>${i === 0 && (t.boss || t.elite || t.minion) ? '🏆 ' : ''}${esc(c.name)}</td><td>${t.boss}</td><td>${t.elite}</td><td>${t.minion}</td></tr>`).join('')}</table>`;
}
function saveBackup() {
  const blob = new Blob([JSON.stringify({ savedAt: new Date().toISOString(), room, state: S }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `delvers-ledger-${room}-round${S.round}-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('Backup saved to your downloads');
}
async function restoreBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { return toast("That file isn't a backup", 'err'); }
  const st = data.state || data;
  const who = (st.order || []).map(id => st.characters?.[id]?.name).filter(Boolean).join(', ');
  if (!confirm(`Load this backup into room ${room}?\n\nSaved ${data.savedAt ? new Date(data.savedAt).toLocaleString() : '(unknown time)'} · round ${st.round ?? '?'}\nHeroes: ${who || 'none'}\n\nEveryone's sheet will jump to it. (Undo can reverse it.)`)) return;
  act({ type: 'restore', state: st }).then(() => toast('Backup restored')).catch(() => {});
}

function bar(cls, v, max, label) {
  return `<div class="bar ${cls}"><i style="width:${max ? Math.min(100, v / max * 100) : 0}%"></i><span>${label}</span></div>`;
}

function heroCard(ch) {
  const C = CLASSES[ch.cls], s = derive(ch);
  const foes = engagedWith(S, ch.id);
  const minions = foes.filter(f => f.type === 'minion');
  const bigs = foes.filter(f => f.type !== 'minion');
  const id = ch.id;
  return `<div class="plate hc ${ch.hp <= 0 ? 'down' : ''}">
    <div class="row">
      <div class="grow"><div class="nm">${heroIcon(ch, C.glyph, 34)} ${esc(ch.name)}</div><div class="sub">${ch.marker != null ? `◰${ch.marker} · ` : ''}${C.name} · move ${s.move}″ · ${reachText(s.reach)} · ${s.dice} dice · ${fmt(s.damage)}/hit · ${s.armor}% armor · ${tallyText(ch)}</div>${ch.hidden ? '<div class="sub" style="color:#c8b6ff">◐ Hidden: skipped by the enemy phase</div>' : ''}</div>
      <a class="icon" href="play.html?room=${room}&as=${id}" target="_blank" title="Open this hero's phone view">↗</a>
      <button class="icon" data-a="edit" data-id="${id}" title="Edit">✎</button>
    </div>
    <div class="bars">
      ${bar('hp', ch.hp, s.maxHp, ch.hp <= 0 ? 'DOWN' : `${fmt(ch.hp)} / ${fmt(s.maxHp)}`)}
      ${ch.ward ? bar('ward', ch.ward, Math.max(ch.ward, 600), `Ward ${fmt(ch.ward)}`) : ''}
      ${bar('en', ch.energy, s.maxEnergy, `Energy ${ch.energy} / ${s.maxEnergy}`)}
    </div>
    ${ch.buffs.label ? `<div class="dim" style="font-size:13px;color:#aef7ee">⚡ ${esc(ch.buffs.label)} primed</div>` : ''}
    ${strikeLeft(ch) ? `<div style="font-size:13px;color:var(--brass-hi)">⚔ ${strikeLeft(ch)} hit${strikeLeft(ch) === 1 ? '' : 's'} to spend</div>` : ''}
    ${S.defense?.[id] ? `<div class="row" style="margin:4px 0;color:#ff9ca4;font-family:var(--display);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:13px">⏳ Rolling defense…<span class="grow"></span><button class="mini" data-a="cancelDef" data-id="${id}" title="Cancel this hero's defense roll">Skip</button></div>` : ''}
    <div class="ctl"><span class="k">Damage</span><div class="btns">${[100, 250, 500, 1000].map(n => `<button class="mini hurt" data-a="hurt" data-id="${id}" data-n="${n}">−${n}</button>`).join('')}
      <input class="numin" data-keep="dmg-${id}" inputmode="numeric" placeholder="###"><button class="mini hurt" data-a="hurtc" data-id="${id}">Hit</button></div></div>
    <div class="ctl"><span class="k">Heal</span><div class="btns">${[250, 500].map(n => `<button class="mini heal" data-a="heal" data-id="${id}" data-n="${n}">+${n}</button>`).join('')}<button class="mini heal" data-a="full" data-id="${id}">Full</button></div></div>
    <div class="ctl"><span class="k">Energy</span><div class="btns">${[-25, -10, 10, 25].map(n => `<button class="mini en" data-a="energy" data-id="${id}" data-n="${n}">${n > 0 ? '+' : '−'}${Math.abs(n)}</button>`).join('')}</div></div>
    <div class="ctl"><span class="k">Foes</span><div class="btns">${[1, 3, 5].map(n => `<button class="mini foe" data-a="spawnOn" data-id="${id}" data-t="minion" data-n="${n}">+${n} ☠</button>`).join('')}<button class="mini foe" data-a="spawnOn" data-id="${id}" data-t="elite" data-n="1">+Elite</button></div></div>
    ${foes.length ? `<div class="foechips">
      ${minions.length ? `<span class="fchip">☠ ×${minions.length}<button data-a="moveM" data-id="${id}" title="Move minions to another hero">⇄</button><button data-a="rmMinion" data-id="${id}" title="Remove one">−</button><button data-a="clearOn" data-id="${id}" title="Clear">✕</button></span>` : ''}
      ${bigs.map(b => `<span class="fchip">${b.pinned ? '📌 ' : ''}${esc(b.name)} ${fmt(b.hp)}<button data-a="rmFoe" data-e="${b.id}">✕</button></span>`).join('')}
    </div>` : ''}
    <div class="ctl"><span class="k">Loot</span><div class="btns">${RARITY_ORDER.map(r => `<button class="mini r r-${r}" data-a="loot" data-id="${id}" data-r="${r}">${RARITIES[r].label}</button>`).join('')}<button class="mini" data-a="loot" data-id="${id}" data-r="random" title="Random rarity">?</button></div></div>
    <button class="gearline" data-a="gear" data-id="${id}" title="Inspect gear and stats"><span class="k">Gear</span><span class="grow">${Object.values(ch.gear).map(i => `<span class="rname r-${i.rarity}">${esc(i.name)}</span>`).join(' · ') || '<span class="faint">nothing equipped</span>'}${ch.bag.length ? ` <span class="faint">· ${ch.bag.length} in satchel</span>` : ''}</span><span class="faint">Inspect ›</span></button>
  </div>`;
}

function spawnPanel() {
  const T = ENEMY_TYPES[spawnCfg.etype];
  return `<div class="grid2">
    <div><label class="lbl">Type</label><select class="field sm" data-cfg="etype">${Object.entries(ENEMY_TYPES).map(([k, t]) => `<option value="${k}" ${k === spawnCfg.etype ? 'selected' : ''}>${t.label}</option>`).join('')}</select></div>
    <div><label class="lbl">Count</label><input class="field sm" data-cfg="count" data-keep="cfg-count" inputmode="numeric" value="${spawnCfg.count}"></div>
    <div style="grid-column:span 2"><label class="lbl">Name</label><input class="field sm" data-cfg="name" data-keep="cfg-name" placeholder="${T.label}" value="${esc(spawnCfg.name)}"></div>
    ${spawnCfg.etype !== 'minion' ? `<div style="grid-column:span 2" class="scalebox"><label class="row" style="gap:8px;cursor:pointer"><input type="checkbox" data-cfgc="scale" ${spawnCfg.scale ? 'checked' : ''}> <span>Scale health to the party</span></label>
      ${spawnCfg.scale ? `<div class="row" style="margin-top:6px;gap:8px"><span class="dim" style="font-size:14px">Last about</span><input class="field sm" data-cfg="rounds" data-keep="cfg-rounds" inputmode="numeric" placeholder="${SCALE_DEFAULT_ROUNDS[spawnCfg.etype]}" value="${spawnCfg.rounds}" style="width:60px"><span class="dim" style="font-size:14px">rounds</span></div><div class="faint" id="scalePreview" style="font-size:13px;margin-top:4px"></div>` : ''}</div>` : ''}
    ${spawnCfg.etype === 'minion' || !spawnCfg.scale ? `<div><label class="lbl">Health</label><input class="field sm" data-cfg="hp" data-keep="cfg-hp" inputmode="numeric" placeholder="${fmt(T.hp)}" value="${spawnCfg.hp}"></div>` : ''}
    <div><label class="lbl">Armor %</label><input class="field sm" data-cfg="armor" data-keep="cfg-armor" inputmode="numeric" placeholder="${T.armor}%" value="${spawnCfg.armor}"></div>
    <div><label class="lbl">Attacks</label><input class="field sm" data-cfg="attacks" data-keep="cfg-attacks" inputmode="numeric" placeholder="${T.attacks}" value="${spawnCfg.attacks}"></div>
    <div><label class="lbl">Damage / blow</label><input class="field sm" data-cfg="damage" data-keep="cfg-damage" inputmode="numeric" placeholder="${fmt(T.damage)}" value="${spawnCfg.damage}"></div>
    ${spawnCfg.etype !== 'minion' ? `<div style="grid-column:span 2"><label class="lbl">Abilities (the app runs these)</label><div class="abchips">${Object.entries(FOE_ABILITIES).map(([k, A]) => `<button class="abchip ${spawnCfg.abilities.includes(k) ? 'on' : ''}" data-a="abToggle" data-k="${k}" title="${esc(A.text)}">${A.icon} ${esc(A.name)}</button>`).join('')}</div>
      <div class="faint" style="font-size:12px;margin-top:4px">${spawnCfg.abilities.map(k => esc(FOE_ABILITIES[k].text)).join('<br>') || 'Tap to add. Hover for details.'}</div></div>` : ''}
    <div style="grid-column:span 2"><label class="lbl">Extra note (shown to players)</label><input class="field sm" data-cfg="ability" data-keep="cfg-ability" placeholder="e.g. Below half health, attacks twice more" value="${esc(spawnCfg.ability)}"></div>
    <div style="grid-column:span 2"><label class="lbl">Engaging</label><select class="field sm" data-cfg="target"><option value="">Roaming (anyone can attack)</option>${S.order.map(id => `<option value="${id}" ${spawnCfg.target === id ? 'selected' : ''}>${esc(S.characters[id].name)}</option>`).join('')}</select></div>
  </div><div style="height:10px"></div><button class="btn solid block" data-a="spawn">Summon</button>`;
}

function roamPanel() {
  const all = Object.values(S.enemies);
  if (!all.length) return `<p class="faint" style="margin:0">The halls are quiet.</p>`;
  const minionCount = all.filter(e => e.type === 'minion').length;
  const bigs = all.filter(e => e.type !== 'minion');
  const roaming = all.filter(e => e.type === 'minion' && !e.target).length;
  return `<p class="dim" style="margin:0 0 6px">${minionCount} minion${minionCount === 1 ? '' : 's'} tracked.</p>
    ${roaming ? `<div class="foechips" style="margin-bottom:6px"><span class="fchip">☠ ×${roaming} roaming<button data-a="moveM" data-id="" title="Assign to a hero">⇄</button></span></div>` : ''}
    ${bigs.map(e => `<div class="foe-row"><div class="row"><span class="nm grow">${e.pinned ? '📌 ' : ''}${esc(e.name)}${e.marker != null ? ` <span class="faint" style="font-size:12px">◰${e.marker}</span>` : ''}</span><span class="faint" style="font-size:12px">${ENEMY_TYPES[e.type].label} · ⛨${e.armor || 0}% · ⚔${e.attacks || 1}×${fmt(e.damage)}</span><button class="mini" data-a="rescale" data-e="${e.id}" title="Re-fit health to the party as it is now (keeps its health %)">⟳ Rescale</button><button class="mini" data-a="rmFoe" data-e="${e.id}">✕</button></div>
      ${bar('foe', e.hp, e.maxHp, `${fmt(e.hp)} / ${fmt(e.maxHp)}`)}${e.ability ? `<div style="font-size:12px;color:#ffcfa8;margin-top:4px">✦ ${esc(e.ability)}</div>` : ''}
      <details class="foeabs" data-e="${e.id}"><summary>${(e.abilities || []).length ? (e.abilities || []).map(k => `<span class="abtag ${(e.fired || []).includes(k) ? 'fired' : ''}" title="${esc(FOE_ABILITIES[k].text)}">${FOE_ABILITIES[k].icon} ${esc(FOE_ABILITIES[k].name)}${(e.fired || []).includes(k) ? ' ✓' : ''}</span>`).join('') : '<span class="faint">No abilities</span>'} <span class="faint" style="font-size:11px">edit</span></summary>
        <div class="abchips" style="margin-top:6px">${Object.entries(FOE_ABILITIES).map(([k, A]) => `<button class="abchip ${(e.abilities || []).includes(k) ? 'on' : ''}" data-a="foeAb" data-e="${e.id}" data-k="${k}" title="${esc(A.text)}">${A.icon} ${esc(A.name)}</button>`).join('')}</div></details>
      <div class="ctl"><select class="field sm grow" data-move="${e.id}" style="min-height:32px"><option value="">Roaming</option>${S.order.map(id => `<option value="${id}" ${e.target === id ? 'selected' : ''}>→ ${esc(S.characters[id].name)}</option>`).join('')}</select>
      <input class="numin" data-keep="edmg-${e.id}" inputmode="numeric" placeholder="dmg"><button class="mini hurt" data-a="dmgFoe" data-e="${e.id}">−</button></div></div>`).join('')}
    <div style="height:10px"></div><button class="btn sm danger block" data-a="clearAll">Clear all foes</button>`;
}

const num = v => { const n = Number(String(v ?? '').replace(/[^\d]/g, '')); return String(v ?? '').trim() === '' || Number.isNaN(n) ? undefined : n; };

function hitCustom(id) {
  const i = document.querySelector(`[data-keep="dmg-${id}"]`);
  const n = Number(i.value.replace(/[^\d]/g, ''));
  if (n > 0) { act({ type: 'hurt', charId: id, amount: n }); i.value = ''; }
}

function scalePreview() {
  const el = $('#scalePreview');
  if (!el) return;
  if (!S.order.length) { el.textContent = 'No heroes yet: default health will be used.'; return; }
  const T = ENEMY_TYPES[spawnCfg.etype];
  const armorIn = document.querySelector('[data-keep="cfg-armor"]')?.value;
  const armor = armorIn ? num(armorIn) ?? T.armor : T.armor;
  const rounds = num(document.querySelector('[data-keep="cfg-rounds"]')?.value) || SCALE_DEFAULT_ROUNDS[spawnCfg.etype];
  el.textContent = `≈ ${fmt(scaledHealth(S, rounds, armor))} health · the party deals ~${fmt(partyDamagePerRound(S, armor))} a round to it`;
}
document.addEventListener('input', e => { if (e.target.dataset.keep === 'cfg-rounds' || e.target.dataset.keep === 'cfg-armor') scalePreview(); });

function onChange(e) {
  if (e.target.id === 'restoreFile') { const f = e.target.files?.[0]; e.target.value = ''; if (f) restoreBackup(f); return; }
  if (e.target.dataset.cfgc === 'scale') { document.querySelectorAll('[data-cfg]').forEach(i => spawnCfg[i.dataset.cfg] = i.value); spawnCfg.scale = e.target.checked; return render(); }
  const c = e.target.dataset.cfg;
  if (c) { spawnCfg[c] = e.target.value; if (c === 'etype') { spawnCfg.hp = spawnCfg.armor = spawnCfg.attacks = spawnCfg.damage = spawnCfg.name = spawnCfg.ability = spawnCfg.rounds = ''; render(); } return; }
  const mv = e.target.dataset.move;
  if (mv) act({ type: 'moveEnemy', enemyId: mv, target: e.target.value || null });
}

function onClick(e) {
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const { a, id, n } = b.dataset;
  switch (a) {
    case 'endRound': return act({ type: 'endRound' });
    case 'enemyPhase': return act({ type: 'enemyPhase' });
    case 'cancelDef': return act({ type: 'cancelDefense', charId: id });
    case 'moveM': return moveSheet(id || null);
    case 'undo': return act({ type: 'undo' });
    case 'save': return saveBackup();
    case 'rakOpen': return act({ type: 'merchant', open: true });
    case 'rakClose': return act({ type: 'merchant', open: false });
    case 'crownDeal': return act({ type: 'crownDeal' });
    case 'crownReveal': return act({ type: 'crownReveal' });
    case 'crownEnd': return act({ type: 'crownEnd' });
    case 'restore': return $('#restoreFile').click();
    case 'reset': if (confirm('Wipe this game? Heroes, foes and loot will be cleared. (Undo can restore it.)')) act({ type: 'resetGame' }); return;
    case 'qr': return qrSheet();
    case 'hurt': return act({ type: 'hurt', charId: id, amount: Number(n) });
    case 'hurtc': return hitCustom(id);
    case 'heal': return act({ type: 'heal', charId: id, amount: Number(n) });
    case 'full': return act({ type: 'heal', charId: id, full: true });
    case 'energy': return act({ type: 'energy', charId: id, amount: Number(n) });
    case 'spawnOn': return act({ type: 'spawn', etype: b.dataset.t, count: Number(n), target: id });
    case 'rmMinion': { const m = engagedWith(S, id).find(f => f.type === 'minion'); if (m) act({ type: 'removeEnemy', enemyId: m.id }); return; }
    case 'clearOn': return act({ type: 'clearEnemies', target: id });
    case 'rmFoe': return act({ type: 'removeEnemy', enemyId: b.dataset.e });
    case 'rescale': return act({ type: 'rescaleEnemy', enemyId: b.dataset.e });
    case 'abToggle': {
      document.querySelectorAll('[data-cfg]').forEach(i => spawnCfg[i.dataset.cfg] = i.value);
      const k = b.dataset.k;
      spawnCfg.abilities = spawnCfg.abilities.includes(k) ? spawnCfg.abilities.filter(x => x !== k) : [...spawnCfg.abilities, k];
      return render();
    }
    case 'foeAb': { // toggle an ability on a foe already on the board
      const e = S.enemies[b.dataset.e]; if (!e) return;
      const k = b.dataset.k, cur = e.abilities || [];
      return act({ type: 'editEnemy', enemyId: e.id, abilities: cur.includes(k) ? cur.filter(x => x !== k) : [...cur, k] });
    }
    case 'clearAll': return act({ type: 'clearEnemies' });
    case 'dmgFoe': { const i = document.querySelector(`[data-keep="edmg-${b.dataset.e}"]`); const v = Number(i.value.replace(/[^\d]/g, '')); if (v) { act({ type: 'damageEnemy', enemyId: b.dataset.e, amount: v }); i.value = ''; } return; }
    case 'loot': return act({ type: 'giveLoot', charId: id, rarity: b.dataset.r });
    case 'spawn': {
      document.querySelectorAll('[data-cfg]').forEach(i => spawnCfg[i.dataset.cfg] = i.value);
      const scale = spawnCfg.etype !== 'minion' && spawnCfg.scale ? (num(spawnCfg.rounds) || SCALE_DEFAULT_ROUNDS[spawnCfg.etype]) : undefined;
      return act({ type: 'spawn', scale, abilities: spawnCfg.abilities, etype: spawnCfg.etype, count: Number(spawnCfg.count) || 1, target: spawnCfg.target || null, name: spawnCfg.name || undefined, hp: num(spawnCfg.hp), armor: spawnCfg.armor === '' ? undefined : num(spawnCfg.armor) ?? 0, attacks: num(spawnCfg.attacks), damage: num(spawnCfg.damage), ability: spawnCfg.ability || undefined });
    }
    case 'edit': return editSheet(id);
    case 'gear': return gearSheet(id);
  }
}

function moveSheet(from) {
  const pool = () => Object.values(S.enemies).filter(e => e.type === 'minion' && (e.target || null) === from).length;
  const n = pool();
  if (!n) return;
  let count = Math.min(n, from ? 1 : n);
  const dests = [...S.order.filter(id => id !== from).map(id => ({ id, name: S.characters[id].name })), ...(from ? [{ id: '', name: 'Roaming' }] : [])];
  const { el, close } = sheet('<div id="mv"></div>');
  const draw = () => {
    el.querySelector('#mv').innerHTML = `<h2>Move minions</h2>
      <p class="dim">From <b>${from ? esc(S.characters[from].name) : 'the roaming pack'}</b>. How many?</p>
      <div class="foechips">${Array.from({ length: n }, (_, i) => `<button class="mini ${count === i + 1 ? 'r r-rare' : ''}" data-c="${i + 1}">${i + 1}</button>`).join('')}</div>
      <p class="dim" style="margin-top:16px">Send them to:</p>
      <div class="foechips">${dests.map(d => `<button class="btn sm" data-to="${d.id}">${esc(d.name)}</button>`).join('')}</div>`;
  };
  draw();
  el.addEventListener('click', e => {
    const c = e.target.closest('[data-c]'); if (c) { count = Number(c.dataset.c); return draw(); }
    const t = e.target.closest('[data-to]'); if (t) { close(); act({ type: 'moveMinions', from, to: t.dataset.to || null, count }); }
  });
}

function qrSheet() {
  const url = `${location.origin}/play.html?room=${room}&new=1`;
  sheet(`<h2 class="center">Join the delve</h2><div class="qrbox">${qrSVG(url, 6)}</div>
    <p class="center"><span class="roomcode" style="font-size:40px">${room}</span></p><p class="center faint" style="word-break:break-all">${esc(url)}</p>`);
}

// ---------------------------------------------------------- gear inspector
let gearOpen = null;
function gearBody(id) {
  const ch = S.characters[id];
  if (!ch) return '<p class="dim">This hero is gone.</p>';
  const C = CLASSES[ch.cls], s = derive(ch), b = C.base;
  const stat = (label, val, base, f = v => v) => `<div><span class="dim">${label}</span><b class="${val > base ? 'up' : ''}">${f(val)}</b></div>`;
  const others = S.order.filter(o => o !== id);
  const acts = (it, equipped) => `<div class="iacts">
      ${equipped ? `<button class="mini" data-ga="unequip" data-slot="${it.slot}">To satchel</button>` : `<button class="mini" data-ga="equip" data-item="${it.id}">Equip</button>`}
      ${others.map(o => `<button class="mini" data-ga="give" data-item="${it.id}" data-to="${o}">→ ${esc(S.characters[o].name)}</button>`).join('')}
      <button class="mini hurt" data-ga="discard" data-item="${it.id}" data-eq="${equipped ? it.slot : ''}">Destroy</button></div>`;
  return `<h2>${heroIcon(ch, C.glyph, 56)} ${esc(ch.name)}</h2>
    <div class="faint" style="font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:12px">${C.name} · ${tallyText(ch)} · green = boosted by gear</div>
    <div class="gstats">
      ${stat('Health', s.maxHp, b.maxHp, fmt)}${stat('Armor', s.armor, b.armor, v => v + '%')}${stat('Dice', s.dice, b.dice)}${stat('Dmg / hit', s.damage, b.damage, fmt)}
      ${stat('Crit', s.critMult, b.critMult, v => '×' + v)}${stat('Cleave', s.cleave, b.cleave)}${stat('Energy / kill', s.energyPerKill, b.energyPerKill)}${stat('Energy / rnd', s.energyPerRound, b.energyPerRound)}
    </div>
    <div class="rule"><span class="gem"></span>Equipped<span class="gem"></span></div>
    <div class="ggrid">${SLOTS.map(sl => ch.gear[sl] ? `<div>${itemHTML(ch.gear[sl], acts(ch.gear[sl], true))}</div>` : `<div class="empty-slot">${SLOT_LABEL[sl]} · empty</div>`).join('')}</div>
    <div class="rule"><span class="gem"></span>Sets &amp; synergies<span class="gem"></span></div>
    ${setsHTML(ch, { gm: true })}
    <div class="rule"><span class="gem"></span>Satchel · ${ch.bag.length}<span class="gem"></span></div>
    ${ch.bag.length ? `<div class="ggrid">${ch.bag.map(it => `<div>${itemHTML(it, acts(it, false))}</div>`).join('')}</div>` : '<p class="faint center">Empty.</p>'}`;
}
function gearSheet(id) {
  const { el, close } = sheet(`<div id="gearbody">${gearBody(id)}</div>`, { onClose: () => { gearOpen = null; } });
  el.classList.add('wide');
  gearOpen = { id, el };
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-ga]');
    if (!b) return;
    const ch = S.characters[id];
    const { ga, item, slot, to, eq } = b.dataset;
    const name = (eq ? ch.gear[eq] : ch.bag.find(x => x.id === item))?.name || 'this item';
    if (ga === 'equip') act({ type: 'equip', charId: id, itemId: item });
    else if (ga === 'unequip') act({ type: 'unequip', charId: id, slot });
    else if (ga === 'give') act({ type: 'giveItem', charId: id, itemId: item, to });
    else if (ga === 'discard' && confirm(`Destroy ${name}? (Undo can bring it back.)`)) {
      if (eq) act({ type: 'unequip', charId: id, slot: eq }).then(() => act({ type: 'discard', charId: id, itemId: item }));
      else act({ type: 'discard', charId: id, itemId: item });
    }
  });
}

function editSheet(id) {
  const ch = S.characters[id];
  const { el, close } = sheet(`<h2>Edit ${esc(ch.name)}</h2>
    <label class="lbl">Name</label><input class="field" id="e-name" value="${esc(ch.name)}">
    <label class="lbl">Calling</label><select class="field" id="e-cls">${Object.entries(CLASSES).map(([k, C]) => `<option value="${k}" ${k === ch.cls ? 'selected' : ''}>${C.name}</option>`).join('')}</select>
    <div class="grid2"><div><label class="lbl">Health</label><input class="field" id="e-hp" inputmode="numeric" value="${ch.hp}"></div><div><label class="lbl">Energy</label><input class="field" id="e-en" inputmode="numeric" value="${ch.energy}"></div>
    <div><label class="lbl">Ward</label><input class="field" id="e-ward" inputmode="numeric" value="${ch.ward}"></div></div>
    <div class="row" style="margin-top:16px"><button class="btn solid grow" id="save">Save</button><button class="btn danger" id="del">Remove hero</button></div>`);
  el.querySelector('#save').onclick = () => { close(); act({ type: 'editCharacter', charId: id, name: $('#e-name').value, cls: $('#e-cls').value, hp: Number($('#e-hp').value), energy: Number($('#e-en').value), ward: Number($('#e-ward').value) }); };
  el.querySelector('#del').onclick = () => { if (confirm(`Remove ${ch.name} from the game?`)) { close(); act({ type: 'removeCharacter', charId: id }); } };
}
</script>
</body>
</html>
